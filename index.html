<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c2721">
<title>Loop Line</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loop Line">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one phone-height column. Scoreboard on top, the island in the middle, the train yard below. */
  /* One visual world (an island at sea), so a single theme by choice. */
  --panel: #1c2721;
  --panel-raised: #27352c;
  --line: #3b4d40;
  --ink: #f2ecd9;
  --muted: #a3b09d;
  --brass: #e2a52e;
  --signal: #c9452c;
  --leaf: #7fa650;
  --sea: #2f6f8f;
  --font-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #141c18;
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.game {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--panel);
}

/* Scoreboard */
.hud {
  padding: calc(10px + env(safe-area-inset-top)) 16px 8px;
  display: flex; flex-direction: column; gap: 7px;
}
.hud-main { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.coins {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.coin {
  width: 0.55em; height: 0.55em; border-radius: 50%;
  background: var(--brass);
  box-shadow: inset 0 0 0 0.07em #f6cf78, inset 0 0 0 0.14em #b47d17;
  flex: none;
}
.coins.bump #coins { animation: bump 240ms ease-out; }
@keyframes bump { 0% { transform: translateY(0); } 40% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
.island-name {
  font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: 0.04em;
  text-transform: uppercase; white-space: nowrap;
}
.progress-label {
  display: flex; justify-content: space-between;
  font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
  margin-bottom: 4px;
}
.bar { height: 8px; border-radius: 4px; background: #131a16; overflow: hidden; }
#clearFill { height: 100%; width: 0; background: var(--leaf); border-radius: 4px; transition: width 300ms ease-out; }
.tip { margin: 0; font-size: 13px; line-height: 1.3; color: var(--muted); min-height: 1.3em; }

/* Island */
.map {
  position: relative; flex: 1; min-height: 0;
  background: var(--sea);
  border-top: 1px solid #0f1512; border-bottom: 1px solid #0f1512;
  cursor: pointer;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chip {
  position: absolute; left: 12px; top: 10px;
  font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.02em;
  background: rgba(20, 28, 24, 0.82); color: var(--ink);
  padding: 4px 9px; border-radius: 6px; pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.hint { left: 50%; top: auto; bottom: 10px; transform: translateX(-50%); white-space: nowrap; }
.toast {
  position: absolute; left: 16px; right: 16px; top: 44px;
  background: rgba(20, 28, 24, 0.94); border: 1px solid var(--brass); border-radius: 10px;
  padding: 10px 12px; font-size: 15px; line-height: 1.35; text-align: center; pointer-events: none;
}
.toast b { color: var(--brass); font-weight: 600; }
[hidden] { display: none !important; }

/* Train yard */
.yard { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 6px; }
.train-row { display: flex; align-items: center; gap: 10px; }
.train-label {
  font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted); white-space: nowrap; min-width: 3.3em;
}
.slots { display: flex; gap: 5px; flex: 1; min-width: 0; }
.slot {
  flex: 1; min-width: 0; height: 34px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 17px; color: #1c2721;
  font-variant-numeric: tabular-nums;
}
.slot.empty { border: 1.5px dashed var(--line); }
.slot.pair { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--brass); }
.slot.new { animation: pop 320ms ease-out; }
@keyframes pop { 0% { transform: scale(0.6); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 3px;
  min-height: 70px; padding: 9px 10px 9px 14px;
  text-align: left; color: var(--ink); font: inherit;
  background: var(--panel-raised); border: 1px solid var(--line); border-radius: 10px;
  cursor: pointer;
}
.act::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe); }
#buy { --stripe: var(--brass); }
#merge { --stripe: #3f86b8; }
#sail { --stripe: var(--leaf); grid-column: 1 / -1; min-height: 56px; border-color: var(--leaf); }
.act:active { transform: scale(0.98); }
.act:focus-visible, .reset:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.act-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.act-stat { font-size: 13px; color: var(--muted); line-height: 1.25; font-variant-numeric: tabular-nums; }
.act-stat b { color: var(--ink); font-weight: 500; }
.act-cost {
  margin-top: auto; display: flex; align-items: center; gap: 5px;
  font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1;
  font-variant-numeric: tabular-nums; color: var(--brass); white-space: nowrap;
}
.act.ready { border-color: var(--brass); }
[aria-disabled="true"] { cursor: default; }
[aria-disabled="true"] .act-cost { color: var(--muted); }
[aria-disabled="true"] .coin { filter: grayscale(1) brightness(0.8); }

.foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 16px calc(8px + env(safe-area-inset-bottom));
  font-size: 12px; color: var(--muted);
}
.reset { font: inherit; color: var(--muted); background: none; border: 0; padding: 8px 0 8px 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.reset.armed { color: var(--signal); font-weight: 600; }

@media (max-height: 700px) {
  .coins { font-size: 32px; }
  .tip { display: none; }
  .act { min-height: 60px; }
}
@media (prefers-reduced-motion: reduce) {
  .coins.bump #coins, .slot.new { animation: none; }
  .act:active { transform: none; }
}
</style>
</head>
<body>
<main class="game">
  <header class="hud">
    <div class="hud-main">
      <div class="coins" id="coinsWrap" aria-label="Coins"><span class="coin"></span><span id="coins">0</span></div>
      <div class="island-name" id="islandName">Island 1</div>
    </div>
    <div>
      <div class="progress-label"><span>Island cleared</span><span id="clearText">0%</span></div>
      <div class="bar"><div id="clearFill"></div></div>
    </div>
    <p class="tip" id="tip"></p>
  </header>

  <div class="map" id="map">
    <canvas id="c" aria-label="The island. The train's carts mine the trees, rocks and ore beside the track. Clearing a side makes the track grow."></canvas>
    <div class="chip" id="steam" hidden></div>
    <div class="chip hint" id="hint" hidden>Tap the island to speed up the train</div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <section class="yard" aria-label="Train yard">
    <div class="train-row">
      <span class="train-label">Carts</span>
      <div class="slots" id="slots"></div>
    </div>
    <div class="buttons">
      <button class="act" type="button" id="sail" hidden>
        <span class="act-name" id="sailName">Sail to Island 2</span>
        <span class="act-stat" id="sailStat">Your carts and coins come with you</span>
      </button>
      <button class="act" type="button" id="buy">
        <span class="act-name">Buy cart</span>
        <span class="act-stat" id="buyStat"></span>
        <span class="act-cost"><span class="coin"></span><span id="buyCost"></span></span>
      </button>
      <button class="act" type="button" id="merge">
        <span class="act-name">Merge</span>
        <span class="act-stat" id="mergeStat"></span>
        <span class="act-cost" id="mergeNote">Free</span>
      </button>
    </div>
  </section>

  <footer class="foot">
    <span>Loop Line · v0.3</span>
    <button class="reset" type="button" id="reset">Reset game</button>
  </footer>
</main>

<script>
(() => {
'use strict';

// <logic>
// Everything between the logic markers is plain game rules with no page or
// drawing code, so it can be run and tested on its own (see test/logic.test.js).

const CFG = {
  W: 13, H: 17,          // island grid in tiles, including the sea around it
  speed: 1.2,            // tiles per second
  carLen: 0.9,           // track length each car takes up, in tiles
  maxSlots: 8,
  cartBaseCost: 10,
  cartCostGrowth: 1.45,
  islandGrowth: 2,       // each island's blocks are this much tougher and richer
  steamPerTap: 0.25, steamMax: 1, steamDecay: 0.5,
  offlineCapSec: 3600,
};

// What covers the island. Tougher blocks lie farther from the middle.
const BLOCKS = {
  tree:   { hp: 2,  value: 1,  name: 'Trees' },
  rock:   { hp: 6,  value: 3,  name: 'Rocks' },
  copper: { hp: 15, value: 8,  name: 'Copper' },
  gold:   { hp: 35, value: 20, name: 'Gold' },
};

const mod = (a, n) => ((a % n) + n) % n;
const CX = (CFG.W - 1) / 2, CY = (CFG.H - 1) / 2;   // the station sits on this tile
// How far the track may grow: one row of land stays outside it on every side.
const LIMIT = { x0: 2, y0: 2, x1: CFG.W - 3, y1: CFG.H - 3 };
const idx = (x, y) => y * CFG.W + x;

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const islandMult = n => Math.pow(CFG.islandGrowth, n - 1);
const maxHpOf = (type, n) => (BLOCKS[type] ? BLOCKS[type].hp * islandMult(n) : 0);
const valueOf = (type, n) => (BLOCKS[type] ? BLOCKS[type].value * islandMult(n) : 0);
const startTrack = () => ({ x0: CX - 1, y0: CY - 1, x1: CX + 1, y1: CY + 1 });

// Lay out island number n. The same number always gives the same island.
function makeIsland(n) {
  const r = rng(n * 7919 + 13);
  const tiles = [];
  for (let y = 0; y < CFG.H; y++) {
    for (let x = 0; x < CFG.W; x++) {
      const edge = Math.min(x, y, CFG.W - 1 - x, CFG.H - 1 - y);
      let type;
      if (edge === 0) type = 'water';
      else if (edge === 1 && r() < 0.25) type = 'water';   // a ragged coast
      else {
        const d = Math.max(Math.abs(x - CX) / (CX - 1), Math.abs(y - CY) / (CY - 1));
        const roll = d + (r() - 0.5) * 0.22;
        type = roll < 0.55 ? 'tree' : roll < 0.76 ? 'rock' : roll < 0.93 ? 'copper' : 'gold';
        if (type !== 'tree' && r() < 0.12) type = 'tree';
      }
      tiles.push({ type, hp: maxHpOf(type, n) });
    }
  }
  // The starting track and the station are already clear, and the first ring is all trees.
  const t = startTrack();
  for (let y = t.y0 - 1; y <= t.y1 + 1; y++) {
    for (let x = t.x0 - 1; x <= t.x1 + 1; x++) {
      const tile = tiles[idx(x, y)];
      if (x >= t.x0 && x <= t.x1 && y >= t.y0 && y <= t.y1) { tile.type = 'grass'; tile.hp = 0; }
      else { tile.type = 'tree'; tile.hp = maxHpOf('tree', n); }
    }
  }
  return tiles;
}

function freshState() {
  return {
    coins: 0, island: 1, tiles: makeIsland(1), track: startTrack(),
    pos: 0, carts: [1], bought: 0, steam: 0, taps: 0, lastSeen: 0,
  };
}

// The track is a rectangle through the middle of its tiles. Distance along it
// starts at the top-left corner and runs clockwise.
const sides = t => ({ w: t.x1 - t.x0, h: t.y1 - t.y0 });
const perimOf = t => 2 * ((t.x1 - t.x0) + (t.y1 - t.y0));
function pointAt(t, s) {
  const { w, h } = sides(t);
  s = mod(s, 2 * (w + h));
  if (s < w) return { x: t.x0 + s, y: t.y0 };
  if ((s -= w) < h) return { x: t.x1, y: t.y0 + s };
  if ((s -= h) < w) return { x: t.x1 - s, y: t.y1 };
  s -= w;
  return { x: t.x0, y: t.y1 - s };
}
// The spot on the track closest to a point.
function nearestS(t, p) {
  const { w, h } = sides(t);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const options = [
    [clamp(p.x, t.x0, t.x1) - t.x0, t.y0, clamp(p.x, t.x0, t.x1)],
    [w + clamp(p.y, t.y0, t.y1) - t.y0, null, null],
    [w + h + t.x1 - clamp(p.x, t.x0, t.x1), null, null],
    [2 * w + h + t.y1 - clamp(p.y, t.y0, t.y1), null, null],
  ];
  let best = 0, bestD = Infinity;
  for (const [s] of options) {
    const q = pointAt(t, s), d = Math.hypot(q.x - p.x, q.y - p.y);
    if (d < bestD) { bestD = d; best = s; }
  }
  return best;
}

// The tiles just outside the track, each with the spot on the track where carts reach it.
const adjCache = new Map();
function adjacency(t) {
  const key = t.x0 + ',' + t.y0 + ',' + t.x1 + ',' + t.y1;
  let list = adjCache.get(key);
  if (list) return list;
  const { w, h } = sides(t);
  list = [];
  const add = (x, y, s) => { if (x >= 0 && y >= 0 && x < CFG.W && y < CFG.H) list.push({ i: idx(x, y), x, y, s }); };
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  for (let x = t.x0 - 1; x <= t.x1 + 1; x++) add(x, t.y0 - 1, cl(x, t.x0, t.x1) - t.x0);
  for (let y = t.y0; y <= t.y1 + 1; y++) add(t.x1 + 1, y, w + cl(y, t.y0, t.y1) - t.y0);
  for (let x = t.x1; x >= t.x0 - 1; x--) add(x, t.y1 + 1, w + h + t.x1 - cl(x, t.x0, t.x1));
  for (let y = t.y1; y >= t.y0; y--) add(t.x0 - 1, y, 2 * w + h + t.y1 - y);
  if (adjCache.size > 400) adjCache.clear();
  adjCache.set(key, list);
  return list;
}

const powerOf = lvl => Math.round(Math.pow(2.2, lvl - 1));
const slotsOf = st => Math.min(CFG.maxSlots, Math.floor(perimOf(st.track) * 0.85 / CFG.carLen) - 1);
const topLevel = st => st.carts.reduce((m, l) => Math.max(m, l), 0);
const buyLevelOf = st => Math.max(1, topLevel(st) - 2);
const cartCostOf = st => Math.ceil(CFG.cartBaseCost * Math.pow(CFG.cartCostGrowth, st.bought));
const canBuyCart = st => st.carts.length < slotsOf(st) && st.coins >= cartCostOf(st);
function buyCart(st) {
  if (!canBuyCart(st)) return false;
  st.coins -= cartCostOf(st);
  st.bought += 1;
  st.carts.push(buyLevelOf(st));
  st.carts.sort((a, b) => b - a);   // strongest carts ride right behind the engine
  return true;
}
// The lowest level with two carts, or 0 when nothing can merge.
function mergeLevel(st) {
  const seen = new Set();
  let best = 0;
  for (const l of st.carts) {
    if (seen.has(l) && (best === 0 || l < best)) best = l;
    seen.add(l);
  }
  return best;
}
function merge(st) {
  const l = mergeLevel(st);
  if (!l) return 0;
  st.carts.splice(st.carts.indexOf(l), 1);
  st.carts.splice(st.carts.indexOf(l), 1);
  st.carts.push(l + 1);
  st.carts.sort((a, b) => b - a);
  return l + 1;
}

function hit(st, i, dmg, events) {
  const tile = st.tiles[i];
  if (tile.hp <= 0) return;
  tile.hp -= dmg;
  if (tile.hp <= 1e-9) {
    tile.hp = 0;
    const gain = valueOf(tile.type, st.island);
    st.coins += gain;
    if (events) events.push({ type: 'break', i, block: tile.type, amount: gain });
  } else if (events) events.push({ type: 'hit', i });
}

// A side of the track moves out one tile once every tile along it is gone.
function rowClear(st, x0, y0, x1, y1) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (st.tiles[idx(x, y)].hp > 0) return false;
  return true;
}
function tryExpand(st, events) {
  const t = st.track;
  let grew = false;
  const before = pointAt(t, st.pos);
  for (let again = true; again;) {
    again = false;
    if (t.y0 > LIMIT.y0 && rowClear(st, t.x0, t.y0 - 1, t.x1, t.y0 - 1)) { t.y0--; again = true; }
    if (t.x1 < LIMIT.x1 && rowClear(st, t.x1 + 1, t.y0, t.x1 + 1, t.y1)) { t.x1++; again = true; }
    if (t.y1 < LIMIT.y1 && rowClear(st, t.x0, t.y1 + 1, t.x1, t.y1 + 1)) { t.y1++; again = true; }
    if (t.x0 > LIMIT.x0 && rowClear(st, t.x0 - 1, t.y0, t.x0 - 1, t.y1)) { t.x0--; again = true; }
    grew = grew || again;
  }
  if (grew) {
    st.pos = nearestS(t, before);   // the train stays where it was on screen
    if (events) events.push({ type: 'grow' });
  }
  return grew;
}

// Move the game forward by a small slice of time (well under one tile of travel).
function step(st, dt, events) {
  const t = st.track, P = perimOf(t);
  const dist = CFG.speed * (1 + st.steam) * dt;
  st.steam = Math.max(0, st.steam - CFG.steamDecay * dt);
  const adj = adjacency(t);
  for (let c = 0; c < st.carts.length; c++) {
    const from = st.pos - (c + 1) * CFG.carLen;
    const dmg = powerOf(st.carts[c]);
    for (const a of adj) {
      const off = mod(a.s - from, P);
      if (off > 0 && off <= dist) hit(st, a.i, dmg, events);
    }
  }
  st.pos = mod(st.pos + dist, P);
  tryExpand(st, events);
}

// Move forward by any amount of time, in safe slices.
function advance(st, seconds, events) {
  const before = st.coins;
  const slice = Math.min(0.1, 0.4 / (CFG.speed * (1 + CFG.steamMax)));
  let left = seconds;
  while (left > 1e-9) {
    const dt = Math.min(slice, left);
    step(st, dt, events);
    left -= dt;
  }
  return st.coins - before;
}

function addSteam(st) {
  st.steam = Math.min(CFG.steamMax, st.steam + CFG.steamPerTap);
  st.taps += 1;
}

// How much of the island is cleared, 0 to 1.
function clearedShare(st) {
  let total = 0, left = 0;
  for (const tile of st.tiles) {
    if (!BLOCKS[tile.type]) continue;
    total += maxHpOf(tile.type, st.island);
    left += tile.hp;
  }
  return total ? 1 - left / total : 1;
}
const islandDone = st => st.tiles.every(tile => tile.hp <= 0);
function sail(st) {
  if (!islandDone(st)) return false;
  st.island += 1;
  st.tiles = makeIsland(st.island);
  st.track = startTrack();
  st.pos = 0;
  return true;
}

function serialize(st, now) {
  return JSON.stringify({
    v: 3, coins: st.coins, island: st.island, track: st.track, pos: st.pos,
    carts: st.carts, bought: st.bought, taps: st.taps,
    hp: st.tiles.map(tile => Math.round(tile.hp * 1000) / 1000), lastSeen: now,
  });
}
function deserialize(text) {
  const st = freshState();
  let raw;
  try { raw = JSON.parse(text); } catch (e) { return st; }
  if (!raw || typeof raw !== 'object' || raw.v !== 3) return st;
  const num = (x, lo, hi, dflt) => (typeof x === 'number' && isFinite(x)) ? Math.min(hi, Math.max(lo, x)) : dflt;
  st.island = Math.floor(num(raw.island, 1, 1000, 1));
  st.tiles = makeIsland(st.island);
  if (Array.isArray(raw.hp) && raw.hp.length === st.tiles.length) {
    st.tiles.forEach((tile, i) => { tile.hp = num(raw.hp[i], 0, maxHpOf(tile.type, st.island), tile.hp); });
  }
  const t = raw.track || {};
  const tr = {
    x0: Math.floor(num(t.x0, LIMIT.x0, CX - 1, CX - 1)), y0: Math.floor(num(t.y0, LIMIT.y0, CY - 1, CY - 1)),
    x1: Math.floor(num(t.x1, CX + 1, LIMIT.x1, CX + 1)), y1: Math.floor(num(t.y1, CY + 1, LIMIT.y1, CY + 1)),
  };
  // The track's own tiles must be clear.
  for (let y = tr.y0; y <= tr.y1; y++) for (let x = tr.x0; x <= tr.x1; x++) st.tiles[idx(x, y)].hp = 0;
  st.track = tr;
  st.coins = num(raw.coins, 0, 1e300, 0);
  st.pos = mod(num(raw.pos, 0, 1e6, 0), perimOf(tr));
  st.bought = Math.floor(num(raw.bought, 0, 1e6, 0));
  st.taps = Math.floor(num(raw.taps, 0, 1e15, 0));
  if (Array.isArray(raw.carts)) {
    const carts = raw.carts.map(l => Math.floor(num(l, 1, 60, 1))).slice(0, CFG.maxSlots);
    if (carts.length) st.carts = carts.sort((a, b) => b - a);

}

function fmt(n) {
  if (n < 1000) return String(Math.floor(n + 1e-9));
  const units = ['K', 'M', 'B', 'T', 'Qa', 'Qi'];
  let i = -1;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  const digits = n >= 100 ? 0 : n >= 10 ? 1 : 2;
  const cut = Math.floor(n * Math.pow(10, digits) + 1e-9) / Math.pow(10, digits);
  return cut.toFixed(digits) + units[i];
}

let newSlot = -1;

const COL = {

  sand: '#d9c48c', grass: '#6b9b4f', grassAlt: '#679649', dirt: 'rgba(110, 84, 50, 0.18)',
  ballast: '#8b8069', sleeper: '#5b4733', rail: '#2b2824',
  trunk: '#6b4a2b', shadow: 'rgba(20, 30, 18, 0.28)',
  leaves: [['#3f6b34', '#5c8c44'], ['#3a6638', '#55874a'], ['#476f2f', '#6a963f']],
  rock: { rock: ['#6f6e68', '#9a998f', null], copper: ['#5c4a40', '#7a6458', '#d5793f'], gold: ['#6e6347', '#8f8160', '#f6cf4d'] },

let W = 0, H = 0, dpr = 1, T = 20, OX = 0, OY = 0;

const tileX = x => OX + (x + 0.5) * T;
const tileY = y => OY + (y + 0.5) * T;

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));

  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// Sea, sand and grass never change on an island, so they are painted once.
function paintGround() {
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  c.fillStyle = COL.sea; c.fillRect(0, 0, W, H);
  const r = rng(st.island * 31 + 7);
  c.strokeStyle = COL.wave; c.lineWidth = Math.max(1, T * 0.06); c.lineCap = 'round';
  for (let i = 0; i < Math.round(W * H / 2200); i++) {
    const x = r() * W, y = r() * H, len = T * (0.4 + r() * 0.5);
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + len / 2, y - T * 0.12, x + len, y); c.stroke();
  }
  const land = (x, y) => x >= 0 && y >= 0 && x < CFG.W && y < CFG.H && st.tiles[idx(x, y)].type !== 'water';
  // Shallow water and a sandy rim first, then grass on top.
  c.fillStyle = 'rgba(120, 190, 200, 0.35)';
  for (let y = 0; y < CFG.H; y++) for (let x = 0; x < CFG.W; x++) {
    if (!land(x, y)) continue;
    roundRect(c, OX + (x - 0.38) * T, OY + (y - 0.38) * T, T * 1.76, T * 1.76, T * 0.7); c.fill();
  }
  c.fillStyle = COL.sand;
  for (let y = 0; y < CFG.H; y++) for (let x = 0; x < CFG.W; x++) {
    if (!land(x, y)) continue;
    roundRect(c, OX + (x - 0.16) * T, OY + (y - 0.16) * T, T * 1.32, T * 1.32, T * 0.45); c.fill();
  }
  for (let y = 0; y < CFG.H; y++) for (let x = 0; x < CFG.W; x++) {
    if (!land(x, y)) continue;
    c.fillStyle = (x + y) % 2 ? COL.grass : COL.grassAlt;
    c.fillRect(OX + x * T - 0.5, OY + y * T - 0.5, T + 1, T + 1);

  c.fillStyle = 'rgba(40, 70, 30, 0.22)';
  for (let y = 0; y < CFG.H; y++) for (let x = 0; x < CFG.W; x++) {
    if (!land(x, y)) continue;
    for (let k = 0; k < 2; k++) {
      c.beginPath(); c.ellipse(OX + (x + 0.15 + r() * 0.7) * T, OY + (y + 0.15 + r() * 0.7) * T, T * 0.05, T * 0.03, 0, 0, 7); c.fill();
    }
  }

}

function resize() {
  const box = el.map.getBoundingClientRect();
  if (box.width < 10 || box.height < 10) return;
  W = box.width; H = box.height;
  dpr = Math.min(3, window.devicePixelRatio || 1);
  el.canvas.width = Math.round(W * dpr); el.canvas.height = Math.round(H * dpr);
  // Fit the island, letting the outer ring of sea fall off the edge.
  T = Math.min(W / (CFG.W - 0.9), H / (CFG.H - 0.9));

  ctx.fillStyle = tone[1]; ctx.beginPath(); ctx.arc(cx - R * 0.22, cy - R * 0.24, R * 0.62, 0, 7); ctx.fill();

  ctx.fillStyle = base; lump(cx, cy, R, seed); ctx.fill();
  ctx.fillStyle = light; lump(cx - R * 0.18, cy - R * 0.2, R * 0.58, seed + 0.3); ctx.fill();

    for (let i = 0; i < 3; i++) {

      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * R * 0.45, cy + Math.sin(a) * R * 0.38, R * 0.17, 0, 7); ctx.fill();
    }
  }

function drawBlocks() {
  const now = clock;
  for (let y = 0; y < CFG.H; y++) for (let x = 0; x < CFG.W; x++) {
    const i = idx(x, y), tile = st.tiles[i];
    if (tile.type === 'water' || tile.type === 'grass') continue;
    let cx = tileX(x), cy = tileY(y);
    if (tile.hp <= 0) {
      // A cleared tile keeps a little mark of what stood there.
      ctx.fillStyle = COL.dirt; ctx.beginPath(); ctx.ellipse(cx, cy, T * 0.26, T * 0.2, 0, 0, 7); ctx.fill();

    if (tile.type === 'tree') drawTree(cx, cy, s, COL.leaves[(x * 3 + y * 5) % 3]);

function trackPath(offset) {

  trackPath(0); ctx.strokeStyle = COL.sleeper; ctx.lineWidth = T * 0.46; ctx.setLineDash([T * 0.09, T * 0.17]); ctx.stroke();

function drawStation() {
  const cx = tileX(CX), cy = tileY(CY), s = T;
  ctx.fillStyle = COL.shadow; roundRect(ctx, cx - s * 0.32 + s * 0.05, cy - s * 0.26 + s * 0.07, s * 0.64, s * 0.52, s * 0.08); ctx.fill();
  ctx.fillStyle = COL.station; roundRect(ctx, cx - s * 0.32, cy - s * 0.26, s * 0.64, s * 0.52, s * 0.08); ctx.fill();
  ctx.fillStyle = COL.stationRoof; roundRect(ctx, cx - s * 0.26, cy - s * 0.2, s * 0.52, s * 0.4, s * 0.05); ctx.fill();
  ctx.strokeStyle = COL.trim; ctx.lineWidth = Math.max(1, s * 0.06);

// A car sits between two points a little ahead and behind, so it turns smoothly at corners.
function carSpot(s) {
  const a = pointAt(st.track, s + 0.38), b = pointAt(st.track, s - 0.38);
  return { x: OX + ((a.x + b.x) / 2 + 0.5) * T, y: OY + ((a.y + b.y) / 2 + 0.5) * T, ang: Math.atan2(a.y - b.y, a.x - b.x) };
}
function drawTrain() {
  const len = T * 0.78, wide = T * 0.5;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + Math.max(9, Math.round(T * 0.38)) + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
  for (let c = st.carts.length - 1; c >= 0; c--) {

    ctx.fillStyle = col; roundRect(ctx, -len / 2 + T * 0.04, -wide / 2 + T * 0.04, len - T * 0.08, wide - T * 0.1, T * 0.08); ctx.fill();

  ctx.fillStyle = COL.engineDark; roundRect(ctx, -len / 2, -wide / 2, len, wide, T * 0.13); ctx.fill();
  ctx.fillStyle = COL.engine; roundRect(ctx, -len / 2, -wide / 2, len, wide - T * 0.05, T * 0.13); ctx.fill();
  ctx.fillStyle = COL.iron; roundRect(ctx, -len / 2 + T * 0.06, -wide / 2 + T * 0.07, T * 0.24, wide - T * 0.17, T * 0.05); ctx.fill();
  ctx.fillStyle = COL.trim; ctx.fillRect(-T * 0.02, -wide / 2 + T * 0.02, T * 0.05, wide - T * 0.07);
  ctx.fillStyle = COL.iron; ctx.beginPath(); ctx.arc(T * 0.18, -T * 0.02, T * 0.1, 0, 7); ctx.fill();

}

function drawFrame(dt) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(groundCache, 0, 0, W, H);
  drawTrack();
  drawStation();
  drawBlocks();
  const eng = drawTrain();

  if (!reduceMotion) {
    puffClock -= dt * (1 + st.steam * 1.5);
    if (puffClock <= 0) {
      puffClock = 0.25;
      puffs.push({ x: eng.x, y: eng.y, age: 0, life: 1.0, drift: (Math.random() - 0.5) * T * 0.3 });
    }
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.age += dt;
    if (p.age >= p.life) { puffs.splice(i, 1); continue; }
    const k = p.age / p.life;
    ctx.fillStyle = 'rgba(240, 238, 228, ' + (0.45 * (1 - k)).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(p.x + p.drift * k, p.y - T * 0.5 * k, T * (0.1 + 0.2 * k), 0, 7); ctx.fill();

  const px = Math.max(12, Math.round(T * 0.5));
  ctx.font = '700 ' + px + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.lineWidth = px / 5;
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.age += dt;
    if (f.age >= f.life) { floats.splice(i, 1); continue; }
    const k = f.age / f.life;
    ctx.globalAlpha = k < 0.7 ? 1 : (1 - k) / 0.3;

    ctx.fillStyle = COL.coin; ctx.fillText(f.text, f.x, y);

const CHIP_COLORS = { tree: '#5c8c44', rock: '#9a998f', copper: '#d5793f', gold: '#f6cf4d' };

      if (!reduceMotion) {
        const n = e.type === 'break' ? 6 : 2;
        for (let k = 0; k < n; k++) chips.push({ x, y, vx: (Math.random() - 0.5) * T * 4, vy: -T * (1 + Math.random() * 2), age: 0, life: 0.5, color: CHIP_COLORS[e.block || st.tiles[e.i].type] || '#fff' });
      }
      if (e.type === 'break') { floats.push({ x, y, text: '+' + fmt(e.amount), age: 0, life: 1.0 }); bump = true; }
    }
  }
  if (chips.length > 120) chips.splice(0, chips.length - 120);
  if (floats.length > 40) floats.splice(0, floats.length - 40);
  if (bump) {
    el.coinsWrap.classList.remove('bump');
    void el.coinsWrap.offsetWidth;
    el.coinsWrap.classList.add('bump');
  }
}

// ---------------------------------------------------------------- time
function awayText(sec) {
  if (sec < 3600) return Math.max(1, Math.round(sec / 60)) + ' min';
  const h = sec / 3600;
  return (h < 10 ? h.toFixed(1) : Math.round(h)) + ' h';
}
function catchUp(seconds) {
  if (!(seconds > 0)) return;
  st.steam = 0;
  const earned = advance(st, Math.min(seconds, CFG.offlineCapSec), null);
  if (seconds >= 60 && earned >= 1) {
    const capped = seconds > CFG.offlineCapSec ? ' The train keeps working for up to ' + awayText(CFG.offlineCapSec) + ' while you are away.' : '';
    showToast('Away for ' + awayText(seconds) + '. The train earned <b>' + fmt(earned) + ' coins</b>.' + capped, 5000);
  }
}

let lastTick = Date.now(), lastSave = Date.now();
const events = [];
function frame() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  if (dt > 1) catchUp(dt);
  else if (dt > 0) {
    events.length = 0;
    advance(st, dt, events);
    if (groundCache) showEvents(events);
  }
  const shownDt = Math.min(Math.max(dt, 0), 0.1);
  clock += shownDt;
  if (groundCache) drawFrame(shownDt);
  updateHud();
  if (now - lastSave > 5000) { lastSave = now; saveState(); }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- input
el.map.addEventListener('pointerdown', e => {
  e.preventDefault();
  addSteam(st);
  puffClock = 0;
});
el.buy.addEventListener('click', () => {
  if (!buyCart(st)) return;
  newSlot = st.carts.lastIndexOf(buyLevelOf(st));
  updateHud(); saveState();
});
el.merge.addEventListener('click', () => {
  const made = merge(st);
  if (!made) return;
  newSlot = st.carts.indexOf(made);
  updateHud(); saveState();
});
el.sail.addEventListener('click', () => {
  if (!sail(st)) return;
  floats.length = 0; chips.length = 0;
  hitTimes = new Float32Array(CFG.W * CFG.H);
  paintGround();
  showToast('Welcome to <b>Island ' + st.island + '</b>. Blocks here are tougher and worth ' + CFG.islandGrowth + '× more.', 4000);
  updateHud(); saveState();
});
let resetTimer = 0;
el.reset.addEventListener('click', () => {
  if (!el.reset.classList.contains('armed')) {
    el.reset.classList.add('armed');
    el.reset.textContent = 'Tap again to erase all progress';
    resetTimer = setTimeout(() => { el.reset.classList.remove('armed'); el.reset.textContent = 'Reset game'; }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  el.reset.classList.remove('armed');
  el.reset.textContent = 'Reset game';
  st = freshState();
  floats.length = 0; chips.length = 0;
  hitTimes = new Float32Array(CFG.W * CFG.H);
  if (W) paintGround();
  saveState();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
window.addEventListener('pagehide', saveState);

// ---------------------------------------------------------------- start
if (window.ResizeObserver) new ResizeObserver(resize).observe(el.map);
else window.addEventListener('resize', resize);
resize();
if (st.lastSeen > 0) catchUp((Date.now() - st.lastSeen) / 1000);
updateHud();
requestAnimationFrame(frame);

// Offline support for the installed app (only where the browser allows it).
try {
  const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || local)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) { /* not available here */ }
})();
</script>
