<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c2721">
<title>Loop Line</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loop Line">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="game">
  <header class="hud">
    <div class="hud-main">
      <div class="purse">
        <div class="coins" id="coinsWrap" aria-label="Coins"><span class="coin"></span><span id="coins">0</span></div>
        <div class="rate"><b id="rate">0</b> coins / min</div>
      </div>
      <div class="island-name" id="islandName">Island 1</div>
    </div>
    <div>
      <div class="progress-label"><span id="progressLabel">Island cleared</span><span id="clearText">0%</span></div>
      <div class="bar"><div id="clearFill"></div></div>
    </div>
    <p class="tip" id="tip"></p>
  </header>

  <div class="map" id="map">
    <canvas id="c" aria-label="The island. The train's carts mine the trees, rocks and ore beside the track. Each cleared block lets the track grow. Hold the island to speed the train up."></canvas>
    <div class="chip" id="steam" hidden></div>
    <div class="chip hint" id="hint" hidden>Hold the island to speed up</div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <section class="yard" aria-label="Train yard">
    <div class="train-row">
      <span class="train-label">Carts</span>
      <div class="slots" id="slots"></div>
    </div>
    <div class="buttons">
      <button class="act" type="button" id="sail" hidden>
        <span class="act-name" id="sailName">Sail to Island 2</span>
        <span class="act-stat" id="sailStat"></span>
      </button>
      <button class="act" type="button" id="buy">
        <span class="act-name">Buy cart</span>
        <span class="act-stat" id="buyStat"></span>
        <span class="act-cost"><span class="coin"></span><span id="buyCost"></span></span>
      </button>
      <button class="act" type="button" id="merge">
        <span class="act-name">Merge</span>
        <span class="act-stat" id="mergeStat"></span>
        <span class="act-cost" id="mergeNote">No pair yet</span>
      </button>
    </div>
  </section>

  <footer class="foot">
    <span>Loop Line · v0.6.2</span>
    <button class="reset" type="button" id="reset">Reset game</button>
  </footer>
</main>

<script type="module" src="src/main.js"></script>
</body>
</html>
