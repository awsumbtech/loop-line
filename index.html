<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c2721">
<title>Loop Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one phone-height column. Scoreboard on top, the map in the middle, a 2x2 workshop below. */
  /* One visual world (a forest map at dusk), so a single theme by choice. */
  --panel: #1c2721;
  --panel-raised: #27352c;
  --line: #3b4d40;
  --ink: #f2ecd9;
  --muted: #a3b09d;
  --brass: #e2a52e;
  --signal: #c9452c;
  --wood: #b5773c;
  --leaf: #7fa650;
  --ground: #5d7a48;
  --font-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #141c18;
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.game {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--panel);
}

/* Scoreboard */
.hud {
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hud-main { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.coins {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.coin {
  width: 0.55em; height: 0.55em; border-radius: 50%;
  background: var(--brass);
  box-shadow: inset 0 0 0 0.07em #f6cf78, inset 0 0 0 0.14em #b47d17;
  flex: none;
}
.coins.bump #coins { animation: bump 240ms ease-out; }
@keyframes bump { 0% { transform: translateY(0); } 40% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
.rate {
  font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--muted);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.rate b { color: var(--ink); font-weight: 600; }
.cargo-label {
  display: flex; justify-content: space-between;
  font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
  margin-bottom: 4px;
}
.bar { height: 8px; border-radius: 4px; background: #131a16; overflow: hidden; }
#cargoFill { height: 100%; width: 0; background: var(--wood); border-radius: 4px; }
#cargoFill.full { background: var(--brass); }
.tip { margin: 0; font-size: 13px; line-height: 1.3; color: var(--muted); min-height: 1.3em; }

/* Map */
.map {
  position: relative; flex: 1; min-height: 0;
  background: var(--ground);
  border-top: 1px solid #0f1512; border-bottom: 1px solid #0f1512;
  cursor: pointer;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chip {
  position: absolute; left: 12px; top: 10px;
  font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.02em;
  background: rgba(20, 28, 24, 0.82); color: var(--ink);
  padding: 4px 9px; border-radius: 6px; pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.hint { left: 50%; top: 64%; transform: translate(-50%, -50%); max-width: 46%; text-align: center; line-height: 1.2; }
.toast {
  position: absolute; left: 16px; right: 16px; top: 44px;
  background: rgba(20, 28, 24, 0.94); border: 1px solid var(--brass); border-radius: 10px;
  padding: 10px 12px; font-size: 15px; line-height: 1.35; text-align: center; pointer-events: none;
}
.toast b { color: var(--brass); font-weight: 600; }
[hidden] { display: none !important; }

/* Workshop */
.shop { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 16px 6px; }
.up {
  position: relative;
  display: flex; flex-direction: column; gap: 3px;
  min-height: 78px; padding: 9px 10px 9px 14px;
  text-align: left; color: var(--ink); font: inherit;
  background: var(--panel-raised); border: 1px solid var(--line); border-radius: 10px;
  cursor: pointer; overflow: hidden;
}
.up::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe); }
.up[data-key="speed"] { --stripe: var(--signal); }
.up[data-key="cargo"] { --stripe: var(--brass); }
.up[data-key="power"] { --stripe: var(--wood); }
.up[data-key="regrow"] { --stripe: var(--leaf); }
.up:active { transform: scale(0.98); }
.up:focus-visible, .reset:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.up-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.up-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.up-lvl { font-family: var(--font-display); font-weight: 500; font-size: 14px; color: var(--muted); white-space: nowrap; }
.up-stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.25; }
.up-stat b { color: var(--ink); font-weight: 500; }
.up-cost {
  margin-top: auto; display: flex; align-items: center; gap: 5px;
  font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1;
  font-variant-numeric: tabular-nums; color: var(--brass);
}
.up[aria-disabled="true"] { cursor: default; }
.up[aria-disabled="true"] .up-cost { color: var(--muted); }
.up[aria-disabled="true"] .coin { filter: grayscale(1) brightness(0.8); }
.up.limit { border-color: var(--brass); }
.up .flag {
  display: none;
  font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  color: #1c2721; background: var(--brass); border-radius: 4px; padding: 1px 5px; margin-left: auto;
}
.up.limit .flag { display: inline-block; }

.foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 16px calc(8px + env(safe-area-inset-bottom));
  font-size: 12px; color: var(--muted);
}
.reset { font: inherit; color: var(--muted); background: none; border: 0; padding: 8px 0 8px 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.reset.armed { color: var(--signal); font-weight: 600; }

@media (max-height: 620px) {
  .coins { font-size: 32px; }
  .tip { display: none; }
  .up { min-height: 68px; }
}
@media (prefers-reduced-motion: reduce) {
  .coins.bump #coins { animation: none; }
  .up:active { transform: none; }
}
</style>
</head>
<body>
<main class="game">
  <header class="hud">
    <div class="hud-main">
      <div class="coins" id="coinsWrap" aria-label="Coins"><span class="coin"></span><span id="coins">0</span></div>
      <div class="rate"><b id="rate">0</b> coins / min</div>
    </div>
    <div>
      <div class="cargo-label"><span>Wagon load</span><span id="cargoText">0 / 10 wood</span></div>
      <div class="bar"><div id="cargoFill"></div></div>
    </div>
    <p class="tip" id="tip"></p>
  </header>

  <div class="map" id="map">
    <canvas id="c" aria-label="Map of the loop. The train cuts trees as it passes and sells wood at the depot."></canvas>
    <div class="chip" id="steam" hidden></div>
    <div class="chip hint" id="hint" hidden>Tap the map to stoke the engine</div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <section class="shop" aria-label="Upgrades">
    <button class="up" type="button" data-key="speed" id="up-speed">
      <span class="up-head"><span class="up-name">Engine</span><span class="flag">Bottleneck</span><span class="up-lvl"></span></span>
      <span class="up-stat"></span><span class="up-cost"><span class="coin"></span><span class="cost-n"></span></span>
    </button>
    <button class="up" type="button" data-key="cargo" id="up-cargo">
      <span class="up-head"><span class="up-name">Wagon</span><span class="flag">Bottleneck</span><span class="up-lvl"></span></span>
      <span class="up-stat"></span><span class="up-cost"><span class="coin"></span><span class="cost-n"></span></span>
    </button>
    <button class="up" type="button" data-key="power" id="up-power">
      <span class="up-head"><span class="up-name">Saw</span><span class="flag">Bottleneck</span><span class="up-lvl"></span></span>
      <span class="up-stat"></span><span class="up-cost"><span class="coin"></span><span class="cost-n"></span></span>
    </button>
    <button class="up" type="button" data-key="regrow" id="up-regrow">
      <span class="up-head"><span class="up-name">Forest</span><span class="flag">Bottleneck</span><span class="up-lvl"></span></span>
      <span class="up-stat"></span><span class="up-cost"><span class="coin"></span><span class="cost-n"></span></span>
    </button>
  </section>

  <footer class="foot">
    <span>Loop Line · v0.1</span>
    <button class="reset" type="button" id="reset">Reset game</button>
  </footer>
</main>

<script>
(() => {
'use strict';

// <logic>
// Everything between the logic markers is plain game rules with no page or
// drawing code, so it can be run and tested on its own (see test/logic.test.js).

const CFG = {
  trackLength: 1000,     // one lap, in track units
  treeCount: 12,
  depotAt: 0,            // where on the loop the depot sits
  woodPrice: 2,          // coins per wood
  baseSpeed: 50,         // track units per second (a 20 second lap)
  baseCargo: 10,         // wood the wagon holds
  basePower: 1,          // wood from one fully grown tree
  baseRegrow: 10,        // seconds for a tree to grow back
  minRegrow: 1.5,
  minCut: 0.05,          // trees smaller than this are left alone
  steamPerTap: 0.25,     // each tap adds this much boost
  steamMax: 1,           // boost tops out at double speed
  steamDecay: 0.5,       // boost lost per second
  offlineCapSec: 3600,   // time away that still earns
  upgrades: {
    speed:  { baseCost: 15, growth: 1.30 },
    cargo:  { baseCost: 10, growth: 1.25 },
    power:  { baseCost: 20, growth: 1.27 },
    regrow: { baseCost: 30, growth: 1.32 },
  },
};
const KEYS = ['speed', 'cargo', 'power', 'regrow'];

function freshState() {
  return {
    coins: 0, totalEarned: 0, laps: 0,
    pos: 0, cargo: 0, steam: 0, taps: 0,
    levels: { speed: 0, cargo: 0, power: 0, regrow: 0 },
    trees: Array.from({ length: CFG.treeCount }, () => 1),  // growth of each tree, 0 to 1
    lastSeen: 0,
  };
}

const mod = (a, n) => ((a % n) + n) % n;
const treePos = i => (i + 0.5) / CFG.treeCount * CFG.trackLength;

// What each upgrade level is worth.
const speedAt  = lvl => CFG.baseSpeed * (1 + 0.1 * lvl);
const cargoAt  = lvl => CFG.baseCargo + 5 * lvl;
const powerAt  = lvl => CFG.basePower + 0.5 * lvl;
const regrowAt = lvl => Math.max(CFG.minRegrow, CFG.baseRegrow * Math.pow(0.93, lvl));

const speedOf   = st => speedAt(st.levels.speed);
const cargoOf   = st => cargoAt(st.levels.cargo);
const powerOf   = st => powerAt(st.levels.power);
const regrowOf  = st => regrowAt(st.levels.regrow);
const lapTimeOf = st => CFG.trackLength / speedOf(st);

function costOf(st, key) {
  const u = CFG.upgrades[key];
  return Math.ceil(u.baseCost * Math.pow(u.growth, st.levels[key]));
}
function isMaxed(st, key) {
  return key === 'regrow' && regrowOf(st) <= CFG.minRegrow;
}
function canBuy(st, key) {
  return !isMaxed(st, key) && st.coins >= costOf(st, key);
}
function buy(st, key) {
  if (!canBuy(st, key)) return false;
  st.coins -= costOf(st, key);
  st.levels[key] += 1;
  return true;
}

function cutTree(st, i, events) {
  const space = cargoOf(st) - st.cargo;
  const grown = st.trees[i];
  if (space <= 1e-9 || grown < CFG.minCut) return;
  const power = powerOf(st);
  const take = Math.min(power * grown, space);
  st.trees[i] = grown - take / power;   // a full wagon leaves part of the tree standing
  st.cargo += take;
  if (events) events.push({ type: 'cut', tree: i, amount: take });
}
function sellCargo(st, events) {
  st.laps += 1;
  if (st.cargo <= 0) return;
  const gain = st.cargo * CFG.woodPrice;
  st.coins += gain;
  st.totalEarned += gain;
  st.cargo = 0;
  if (events) events.push({ type: 'sell', amount: gain });
}

// Move the game forward by a small slice of time (well under one lap).
function step(st, dt, events) {
  const L = CFG.trackLength;
  const grow = dt / regrowOf(st);
  for (let i = 0; i < st.trees.length; i++) {
    if (st.trees[i] < 1) st.trees[i] = Math.min(1, st.trees[i] + grow);
  }
  const dist = speedOf(st) * (1 + st.steam) * dt;
  st.steam = Math.max(0, st.steam - CFG.steamDecay * dt);

  // Everything the engine passes in this slice, in the order it passes it.
  const from = st.pos;
  const hits = [];
  for (let i = 0; i < st.trees.length; i++) {
    const off = mod(treePos(i) - from, L);
    if (off > 0 && off <= dist) hits.push([off, i]);
  }
  const depotOff = mod(CFG.depotAt - from, L);
  if (depotOff > 0 && depotOff <= dist) hits.push([depotOff, -1]);
  hits.sort((a, b) => a[0] - b[0]);
  for (const [, i] of hits) {
    if (i >= 0) cutTree(st, i, events); else sellCargo(st, events);
  }
  st.pos = mod(from + dist, L);
}

// Move forward by any amount of time, in safe slices. Returns coins earned.
function advance(st, seconds, events) {
  const before = st.totalEarned;
  const slice = Math.min(0.1, 0.2 * CFG.trackLength / (speedOf(st) * (1 + CFG.steamMax)));
  let left = seconds;
  while (left > 1e-9) {
    const dt = Math.min(slice, left);
    step(st, dt, events);
    left -= dt;
  }
  return st.totalEarned - before;
}

function addSteam(st) {
  st.steam = Math.min(CFG.steamMax, st.steam + CFG.steamPerTap);
  st.taps += 1;
}

// Wood the forest can offer on one lap, and what the wagon actually carries.
function woodOfferedPerLap(st) {
  const regrownShare = Math.min(1, lapTimeOf(st) / regrowOf(st));
  return CFG.treeCount * powerOf(st) * regrownShare;
}
function incomePerMin(st) {
  const wood = Math.min(cargoOf(st), woodOfferedPerLap(st));
  return wood * CFG.woodPrice * 60 / lapTimeOf(st);
}
// Which part is holding income back right now.
function bottleneck(st) {
  if (woodOfferedPerLap(st) > cargoOf(st) + 1e-9) return 'cargo';
  if (lapTimeOf(st) < regrowOf(st) - 1e-9 && !isMaxed(st, 'regrow')) return 'regrow';
  return 'none';
}

function serialize(st, now) {
  return JSON.stringify({
    v: 1, coins: st.coins, totalEarned: st.totalEarned, laps: st.laps,
    pos: st.pos, cargo: st.cargo, taps: st.taps,
    levels: st.levels, trees: st.trees, lastSeen: now,
  });
}
function deserialize(text) {
  const st = freshState();
  let raw;
  try { raw = JSON.parse(text); } catch (e) { return st; }
  if (!raw || typeof raw !== 'object' || raw.v !== 1) return st;
  const num = (x, lo, hi, dflt) => (typeof x === 'number' && isFinite(x)) ? Math.min(hi, Math.max(lo, x)) : dflt;
  st.coins = num(raw.coins, 0, 1e300, 0);
  st.totalEarned = num(raw.totalEarned, 0, 1e300, 0);
  st.laps = Math.floor(num(raw.laps, 0, 1e15, 0));
  st.pos = mod(num(raw.pos, 0, 1e9, 0), CFG.trackLength);
  st.taps = Math.floor(num(raw.taps, 0, 1e15, 0));
  for (const k of KEYS) st.levels[k] = Math.floor(num(raw.levels && raw.levels[k], 0, 5000, 0));
  st.cargo = num(raw.cargo, 0, cargoOf(st), 0);
  if (Array.isArray(raw.trees)) {
    for (let i = 0; i < st.trees.length; i++) st.trees[i] = num(raw.trees[i], 0, 1, 1);
  }
  st.lastSeen = num(raw.lastSeen, 0, 1e15, 0);
  return st;
}

function fmt(n) {
  if (n < 1000) return String(Math.floor(n + 1e-9));
  const units = ['K', 'M', 'B', 'T', 'Qa', 'Qi'];
  let i = -1;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  const digits = n >= 100 ? 0 : n >= 10 ? 1 : 2;
  const cut = Math.floor(n * Math.pow(10, digits) + 1e-9) / Math.pow(10, digits);
  return cut.toFixed(digits) + units[i];
}
const fmt1 = n => (Math.abs(n - Math.round(n)) < 0.05 ? String(Math.round(n)) : n.toFixed(1));

const Logic = {
  CFG, KEYS, freshState, treePos, speedAt, cargoAt, powerAt, regrowAt,
  speedOf, cargoOf, powerOf, regrowOf, lapTimeOf, costOf, isMaxed, canBuy, buy,
  step, advance, addSteam, woodOfferedPerLap, incomePerMin, bottleneck,
  serialize, deserialize, fmt, fmt1,
};
// </logic>

if (typeof document === 'undefined') return;

// ---------------------------------------------------------------- saving
const SAVE_KEY = 'loopline.save.v1';
function loadState() {
  try {
    const text = localStorage.getItem(SAVE_KEY);
    if (text) return deserialize(text);
  } catch (e) { /* storage unavailable: play without saving */ }
  return freshState();
}
function saveState() {
  try { localStorage.setItem(SAVE_KEY, serialize(st, Date.now())); } catch (e) { /* ignore */ }
}

let st = loadState();

// ---------------------------------------------------------------- page elements
const $ = id => document.getElementById(id);
const el = {
  coins: $('coins'), coinsWrap: $('coinsWrap'), rate: $('rate'),
  cargoText: $('cargoText'), cargoFill: $('cargoFill'), tip: $('tip'),
  map: $('map'), canvas: $('c'), steam: $('steam'), hint: $('hint'), toast: $('toast'),
  reset: $('reset'),
};
const upEls = {};
for (const key of KEYS) {
  const b = $('up-' + key);
  upEls[key] = { btn: b, lvl: b.querySelector('.up-lvl'), stat: b.querySelector('.up-stat'), cost: b.querySelector('.cost-n') };
}
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Only touch the page when a value actually changes.
const shown = new Map();
function setText(node, text) { if (shown.get(node) !== text) { shown.set(node, text); node.textContent = text; } }
function setHTML(node, html) { if (shown.get(node) !== html) { shown.set(node, html); node.innerHTML = html; } }

const TIPS = {
  cargo: 'The wagon fills before the lap ends. A bigger wagon earns more.',
  regrow: 'Trees are still growing back when the train returns. A healthier forest earns more.',
  none: 'The wagon has room to spare. A sharper saw or a faster engine earns more.',
};
const LIMIT_BUTTON = { cargo: 'cargo', regrow: 'regrow' };

function statLine(key) {
  const lvl = st.levels[key];
  if (isMaxed(st, key)) return 'Regrow <b>' + regrowAt(lvl).toFixed(1) + 's</b>';
  const pair = (a, b) => '<b>' + a + '</b> → <b>' + b + '</b>';
  if (key === 'speed') return 'Lap ' + pair((CFG.trackLength / speedAt(lvl)).toFixed(1) + 's', (CFG.trackLength / speedAt(lvl + 1)).toFixed(1) + 's');
  if (key === 'cargo') return 'Holds ' + pair(fmt(cargoAt(lvl)), fmt(cargoAt(lvl + 1)));
  if (key === 'power') return 'Wood per tree ' + pair(fmt1(powerAt(lvl)), fmt1(powerAt(lvl + 1)));
  return 'Regrow ' + pair(regrowAt(lvl).toFixed(1) + 's', regrowAt(lvl + 1).toFixed(1) + 's');
}

function updateHud() {
  setText(el.coins, fmt(st.coins));
  setText(el.rate, fmt(incomePerMin(st)));
  const cap = cargoOf(st);
  setText(el.cargoText, fmt1(Math.min(cap, st.cargo)) + ' / ' + fmt(cap) + ' wood');
  const pct = Math.round(Math.min(1, st.cargo / cap) * 100);
  if (shown.get(el.cargoFill) !== pct) {
    shown.set(el.cargoFill, pct);
    el.cargoFill.style.width = pct + '%';
    el.cargoFill.classList.toggle('full', pct >= 100);
  }
  const limit = bottleneck(st);
  setText(el.tip, TIPS[limit]);
  for (const key of KEYS) {
    const u = upEls[key];
    const maxed = isMaxed(st, key);
    setText(u.lvl, 'Lv ' + st.levels[key]);
    setHTML(u.stat, statLine(key));
    setText(u.cost, maxed ? 'Max' : fmt(costOf(st, key)));
    const off = String(!canBuy(st, key));
    if (u.btn.getAttribute('aria-disabled') !== off) u.btn.setAttribute('aria-disabled', off);
    u.btn.classList.toggle('limit', LIMIT_BUTTON[limit] === key);
  }
  if (st.steam > 0.02) {
    el.steam.hidden = false;
    setText(el.steam, 'Steam ×' + (1 + st.steam).toFixed(2));
  } else if (!el.steam.hidden) {
    el.steam.hidden = true;
  }
  const wantHint = st.taps < 5;
  if (el.hint.hidden === wantHint) el.hint.hidden = !wantHint;
}

let toastTimer = 0;
function showToast(html, ms) {
  el.toast.innerHTML = html;
  el.toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.toast.hidden = true; }, ms);
}

// ---------------------------------------------------------------- drawing
const ctx = el.canvas.getContext('2d');
const COL = {
  ground: '#5d7a48', meadow: '#668450', speckA: '#6f8d55', speckB: '#506b3d',
  ballast: '#8b8069', sleeper: '#5b4733', rail: '#2b2824',
  trunk: '#6b4a2b', stumpTop: '#c79a63', shadow: 'rgba(20, 30, 18, 0.28)',
  engine: '#c9452c', engineDark: '#8f2d1c', iron: '#2b2824', ironLight: '#57514a',
  wagon: '#d1a13a', wagonDark: '#8a6a1f', wagonBed: '#3a2f22', log: '#b5773c', logEnd: '#deb078',
  depotWall: '#7a4a32', depotRoof: '#3b2a22', depotTrim: '#e2a52e', platform: '#b9ad93',
  wood: '#f0c58d', coin: '#f3bf4f',
};
const LEAVES = [['#3f6b34', '#5c8c44'], ['#3a6638', '#55874a'], ['#476f2f', '#6a963f']];

let W = 0, H = 0, dpr = 1, U = 1;
let track = null, groundCache = null;
const floats = [], puffs = [];
let puffClock = 0;

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// The loop is a stadium shape: two straights joined by two half circles.
// at(f) gives the spot a fraction f of the way round, with the direction of
// travel (dx, dy) and the direction pointing away from the loop (nx, ny).
function buildTrack() {
  const tall = H >= W;
  const w0 = tall ? W : H, h0 = tall ? H : W;
  const margin = Math.min(72, Math.max(44, Math.min(W, H) * 0.16));
  const w = Math.max(40, w0 - 2 * margin), h = Math.max(40, h0 - 2 * margin);
  const r = Math.min(w, h) / 2, straight = Math.max(w, h) - 2 * r;
  const cx = w0 / 2, cy = h0 / 2, half = straight / 2;
  const perim = 2 * straight + 2 * Math.PI * r;
  function at(f) {
    let d = mod(f, 1) * perim;
    let x, y, dx, dy;
    if (d < half) { x = cx - r; y = cy - d; dx = 0; dy = -1; }
    else if ((d -= half) < Math.PI * r) {
      const a = Math.PI + d / r;
      x = cx + r * Math.cos(a); y = cy - half + r * Math.sin(a); dx = -Math.sin(a); dy = Math.cos(a);
    }
    else if ((d -= Math.PI * r) < straight) { x = cx + r; y = cy - half + d; dx = 0; dy = 1; }
    else if ((d -= straight) < Math.PI * r) {
      const a = d / r;
      x = cx + r * Math.cos(a); y = cy + half + r * Math.sin(a); dx = -Math.sin(a); dy = Math.cos(a);
    }
    else { d -= Math.PI * r; x = cx - r; y = cy + half - d; dx = 0; dy = -1; }
    let nx = dy, ny = -dx;
    if (!tall) { [x, y] = [y, x]; [dx, dy] = [dy, dx]; [nx, ny] = [ny, nx]; }
    return { x, y, dx, dy, nx, ny };
  }
  const trees = [];
  const pick = rng(7);
  for (let i = 0; i < CFG.treeCount; i++) {
    const p = at(treePos(i) / CFG.trackLength);
    // Trees alternate sides of the track; the pair beside the depot stay outside to leave it room.
    const inside = i % 2 === 1 && i !== CFG.treeCount - 1;
    const off = (inside ? -28 : 30) * U;
    trees.push({ x: p.x + p.nx * off, y: p.y + p.ny * off, tone: LEAVES[Math.floor(pick() * LEAVES.length)], sway: pick() });
  }
  const dp = at(CFG.depotAt / CFG.trackLength);
  const depot = { p: dp, x: dp.x - dp.nx * 36 * U, y: dp.y - dp.ny * 36 * U };
  return { at, perim, trees, depot };
}

function tracePath(c, offset) {
  c.beginPath();
  const n = 240;
  for (let i = 0; i <= n; i++) {
    const p = track.at(i / n);
    const x = p.x + p.nx * offset, y = p.y + p.ny * offset;
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.closePath();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  if (c.roundRect) { c.roundRect(x, y, w, h, r); return; }
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// Ground, track and depot never move, so they are painted once and reused.
function paintGround() {
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  c.fillStyle = COL.ground; c.fillRect(0, 0, W, H);
  tracePath(c, 0); c.fillStyle = COL.meadow; c.fill();
  const r = rng(42);
  const count = Math.round(W * H / 650);
  for (let i = 0; i < count; i++) {
    c.fillStyle = r() < 0.5 ? COL.speckA : COL.speckB;
    c.globalAlpha = 0.35 + r() * 0.4;
    c.beginPath();
    c.ellipse(r() * W, r() * H, (1.2 + r() * 2.2) * U, (0.8 + r() * 1.2) * U, r() * 3, 0, 7);
    c.fill();
  }
  c.globalAlpha = 1;

  // Track bed, sleepers, then the two rails.
  c.lineJoin = 'round';
  tracePath(c, 0); c.strokeStyle = 'rgba(20, 30, 18, 0.22)'; c.lineWidth = 26 * U; c.stroke();
  tracePath(c, 0); c.strokeStyle = COL.ballast; c.lineWidth = 21 * U; c.stroke();
  tracePath(c, 0); c.strokeStyle = COL.sleeper; c.lineWidth = 16 * U; c.setLineDash([3 * U, 6.5 * U]); c.stroke();
  c.setLineDash([]);
  c.strokeStyle = COL.rail; c.lineWidth = 2 * U;
  tracePath(c, 4.5 * U); c.stroke();
  tracePath(c, -4.5 * U); c.stroke();

  // Depot: a platform beside the track and a shed behind it.
  const d = track.depot, ang = Math.atan2(d.p.dy, d.p.dx);
  c.save();
  c.translate(d.p.x - d.p.nx * 17 * U, d.p.y - d.p.ny * 17 * U); c.rotate(ang);
  c.fillStyle = COL.platform; roundRect(c, -30 * U, -5 * U, 60 * U, 10 * U, 2 * U); c.fill();
  c.restore();
  c.save();
  c.translate(d.x, d.y); c.rotate(ang);
  c.fillStyle = COL.shadow; roundRect(c, -24 * U + 2 * U, -13 * U + 3 * U, 48 * U, 26 * U, 3 * U); c.fill();
  c.fillStyle = COL.depotWall; roundRect(c, -24 * U, -13 * U, 48 * U, 26 * U, 3 * U); c.fill();
  c.fillStyle = COL.depotRoof; roundRect(c, -21 * U, -10 * U, 42 * U, 20 * U, 2 * U); c.fill();
  c.strokeStyle = COL.depotTrim; c.lineWidth = 2 * U;
  c.beginPath(); c.moveTo(-21 * U, 0); c.lineTo(21 * U, 0); c.stroke();
  c.restore();
  const ix = -d.p.nx, iy = -d.p.ny;   // pointing into the loop
  c.font = '700 ' + Math.round(13 * U) + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
  c.fillStyle = 'rgba(242, 236, 217, 0.9)';
  if (Math.abs(ix) > 0.5) {
    c.textAlign = ix > 0 ? 'left' : 'right'; c.textBaseline = 'middle';
    c.fillText('DEPOT', d.x + ix * 20 * U, d.y);
  } else {
    c.textAlign = 'center'; c.textBaseline = iy > 0 ? 'top' : 'bottom';
    c.fillText('DEPOT', d.x, d.y + iy * 20 * U);
  }
  return cv;
}

function resize() {
  const box = el.map.getBoundingClientRect();
  if (box.width < 10 || box.height < 10) return;
  W = box.width; H = box.height;
  dpr = Math.min(3, window.devicePixelRatio || 1);
  el.canvas.width = Math.round(W * dpr); el.canvas.height = Math.round(H * dpr);
  U = Math.min(1.6, Math.max(0.8, Math.min(W, H) / 360));
  track = buildTrack();
  groundCache = paintGround();
}

function drawTree(t, grown, time) {
  ctx.fillStyle = COL.shadow;
  if (grown < 0.12) {
    ctx.beginPath(); ctx.ellipse(t.x + U, t.y + 1.5 * U, 5 * U, 3.5 * U, 0, 0, 7); ctx.fill();
    ctx.fillStyle = COL.trunk; ctx.beginPath(); ctx.arc(t.x, t.y, 4 * U, 0, 7); ctx.fill();
    ctx.fillStyle = COL.stumpTop; ctx.beginPath(); ctx.arc(t.x, t.y, 2.6 * U, 0, 7); ctx.fill();
    return;
  }
  const R = (4.5 + 9.5 * grown) * U;
  const sway = reduceMotion ? 0 : Math.sin(time * 1.3 + t.sway * 6.28) * 0.6 * U;
  ctx.beginPath(); ctx.ellipse(t.x + 2 * U, t.y + 3 * U, R, R * 0.85, 0, 0, 7); ctx.fill();
  ctx.fillStyle = t.tone[0]; ctx.beginPath(); ctx.arc(t.x + sway, t.y, R, 0, 7); ctx.fill();
  ctx.fillStyle = t.tone[1]; ctx.beginPath(); ctx.arc(t.x + sway - R * 0.22, t.y - R * 0.24, R * 0.62, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.10)'; ctx.beginPath(); ctx.arc(t.x + sway - R * 0.34, t.y - R * 0.36, R * 0.28, 0, 7); ctx.fill();
}

// Where a train car sits, given how far behind the engine's nose its middle is (in screen px).
function carSpot(behindPx) {
  return track.at(st.pos / CFG.trackLength - behindPx / track.perim);
}
function withCar(p, draw) {
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.dy, p.dx)); draw(); ctx.restore();
}

function drawTrain() {
  const engLen = 32 * U, wagLen = 28 * U, wide = 15 * U, gap = 4 * U;
  const eng = carSpot(engLen / 2), wag = carSpot(engLen + gap + wagLen / 2);
  const link = carSpot(engLen + gap / 2);

  ctx.fillStyle = COL.iron;
  ctx.beginPath(); ctx.arc(link.x, link.y, 2.2 * U, 0, 7); ctx.fill();

  withCar(wag, () => {
    ctx.fillStyle = COL.shadow; roundRect(ctx, -wagLen / 2 + 1.5 * U, -wide / 2 + 2.5 * U, wagLen, wide, 3 * U); ctx.fill();
    ctx.fillStyle = COL.wagonDark; roundRect(ctx, -wagLen / 2, -wide / 2, wagLen, wide, 3 * U); ctx.fill();
    ctx.fillStyle = COL.wagon; roundRect(ctx, -wagLen / 2, -wide / 2, wagLen, wide - 1.5 * U, 3 * U); ctx.fill();
    const bedL = wagLen - 6 * U, bedW = wide - 6.5 * U;
    ctx.fillStyle = COL.wagonBed; roundRect(ctx, -bedL / 2, -wide / 2 + 2.5 * U, bedL, bedW, 1.5 * U); ctx.fill();
    // Logs fill the bed from the back as the wagon loads up.
    const full = Math.min(1, st.cargo / cargoOf(st));
    if (full > 0.02) {
      const len = bedL * full, rows = 3, rowH = bedW / rows;
      for (let i = 0; i < rows; i++) {
        const y = -wide / 2 + 2.5 * U + i * rowH;
        ctx.fillStyle = COL.log; roundRect(ctx, -bedL / 2, y + 0.4 * U, len, rowH - 0.8 * U, rowH / 2.4); ctx.fill();
        ctx.fillStyle = COL.logEnd; ctx.beginPath(); ctx.arc(-bedL / 2 + len - rowH * 0.42, y + rowH / 2, rowH * 0.26, 0, 7); ctx.fill();
      }
    }
  });

  withCar(eng, () => {
    ctx.fillStyle = COL.shadow; roundRect(ctx, -engLen / 2 + 1.5 * U, -wide / 2 + 2.5 * U, engLen, wide, 4 * U); ctx.fill();
    ctx.fillStyle = COL.engineDark; roundRect(ctx, -engLen / 2, -wide / 2, engLen, wide, 4 * U); ctx.fill();
    ctx.fillStyle = COL.engine; roundRect(ctx, -engLen / 2, -wide / 2, engLen, wide - 1.5 * U, 4 * U); ctx.fill();
    // Cab at the back, boiler band, stack and a saw blade out front.
    ctx.fillStyle = COL.iron; roundRect(ctx, -engLen / 2 + 2 * U, -wide / 2 + 2 * U, 9 * U, wide - 5.5 * U, 2 * U); ctx.fill();
    ctx.fillStyle = COL.ironLight; roundRect(ctx, -engLen / 2 + 3.5 * U, -wide / 2 + 3.5 * U, 6 * U, wide - 8.5 * U, 1 * U); ctx.fill();
    ctx.fillStyle = COL.depotTrim; ctx.fillRect(-1 * U, -wide / 2 + 0.5 * U, 2 * U, wide - 2.5 * U);
    ctx.fillStyle = COL.iron; ctx.beginPath(); ctx.arc(7.5 * U, -0.7 * U, 4 * U, 0, 7); ctx.fill();
    ctx.fillStyle = '#12100e'; ctx.beginPath(); ctx.arc(7.5 * U, -0.7 * U, 2.3 * U, 0, 7); ctx.fill();
    ctx.fillStyle = COL.iron; ctx.fillRect(engLen / 2 - 1.5 * U, -wide / 2 - 2.5 * U, 2.5 * U, wide + 3.5 * U);
  });
  return eng;
}

function drawFrame(dt, time) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(groundCache, 0, 0, W, H);
  for (let i = 0; i < track.trees.length; i++) drawTree(track.trees[i], st.trees[i], time);
  const eng = drawTrain();

  if (!reduceMotion) {
    puffClock -= dt * (1 + st.steam * 1.5);
    if (puffClock <= 0) {
      puffClock = 0.22;
      puffs.push({ x: eng.x + eng.dx * 7.5 * U, y: eng.y + eng.dy * 7.5 * U, age: 0, life: 1.1, drift: (Math.random() - 0.5) * 8 * U });
    }
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i];
      p.age += dt;
      if (p.age >= p.life) { puffs.splice(i, 1); continue; }
      const k = p.age / p.life;
      ctx.fillStyle = 'rgba(240, 238, 228, ' + (0.5 * (1 - k)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x + p.drift * k, p.y - 14 * U * k, (3 + 6 * k) * U, 0, 7); ctx.fill();
    }
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + Math.round(16 * U) + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.lineWidth = 3 * U; ctx.lineJoin = 'round';
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.age += dt;
    if (f.age >= f.life) { floats.splice(i, 1); continue; }
    const k = f.age / f.life;
    ctx.globalAlpha = k < 0.7 ? 1 : (1 - k) / 0.3;
    const y = Math.max(12 * U, f.y - (reduceMotion ? 10 : 10 + 22 * k) * U);   // keep the number on the map
    ctx.strokeStyle = 'rgba(20, 28, 24, 0.85)'; ctx.strokeText(f.text, f.x, y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, y);
  }
  ctx.globalAlpha = 1;
}

function showEvents(events) {
  for (const e of events) {
    if (e.type === 'cut') {
      if (e.amount < 0.05) continue;
      const t = track.trees[e.tree];
      floats.push({ x: t.x, y: t.y, text: '+' + fmt1(e.amount), color: COL.wood, age: 0, life: 0.9 });
    } else if (e.type === 'sell') {
      const d = track.depot;
      floats.push({ x: d.x, y: d.y - 12 * U, text: '+' + fmt(e.amount) + ' coins', color: COL.coin, age: 0, life: 1.4 });
      el.coinsWrap.classList.remove('bump');
      void el.coinsWrap.offsetWidth;
      el.coinsWrap.classList.add('bump');
    }
  }
  if (floats.length > 40) floats.splice(0, floats.length - 40);
}

// ---------------------------------------------------------------- time
function awayText(sec) {
  if (sec < 3600) return Math.max(1, Math.round(sec / 60)) + ' min';
  const h = sec / 3600;
  return (h < 10 ? h.toFixed(1) : Math.round(h)) + ' h';
}
// Catch up on time spent with the page closed or in the background.
function catchUp(seconds) {
  if (!(seconds > 0)) return;
  st.steam = 0;
  const counted = Math.min(seconds, CFG.offlineCapSec);
  const earned = advance(st, counted, null);
  if (seconds >= 60 && earned >= 1) {
    const capped = seconds > CFG.offlineCapSec ? ' The train keeps earning for up to ' + awayText(CFG.offlineCapSec) + ' while you are away.' : '';
    showToast('Away for ' + awayText(seconds) + '. The train earned <b>' + fmt(earned) + ' coins</b>.' + capped, 5000);
  }
}

let lastTick = Date.now();
let lastSave = Date.now();
const events = [];
function frame() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  if (dt > 1) {
    catchUp(dt);               // the page was asleep
  } else if (dt > 0) {
    events.length = 0;
    advance(st, dt, events);
    if (track) showEvents(events);
  }
  if (track) drawFrame(Math.min(Math.max(dt, 0), 0.1), now / 1000);
  updateHud();
  if (now - lastSave > 5000) { lastSave = now; saveState(); }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- input
el.map.addEventListener('pointerdown', e => {
  e.preventDefault();
  addSteam(st);
  puffClock = 0;
});
for (const key of KEYS) {
  upEls[key].btn.addEventListener('click', () => {
    if (buy(st, key)) { updateHud(); saveState(); }
  });
}
let resetTimer = 0;
el.reset.addEventListener('click', () => {
  if (!el.reset.classList.contains('armed')) {
    el.reset.classList.add('armed');
    el.reset.textContent = 'Tap again to erase all progress';
    resetTimer = setTimeout(() => { el.reset.classList.remove('armed'); el.reset.textContent = 'Reset game'; }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  el.reset.classList.remove('armed');
  el.reset.textContent = 'Reset game';
  st = freshState();
  floats.length = 0;
  saveState();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
window.addEventListener('pagehide', saveState);

// ---------------------------------------------------------------- start
if (window.ResizeObserver) new ResizeObserver(resize).observe(el.map);
else window.addEventListener('resize', resize);
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (track) groundCache = paintGround(); });
if (st.lastSeen > 0) catchUp((Date.now() - st.lastSeen) / 1000);
updateHud();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
