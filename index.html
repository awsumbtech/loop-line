<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c2721">
<title>Loop Line</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loop Line">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one phone-height column. Scoreboard on top, the map in the middle, the workshop below. */
  /* One visual world (a forest map at dusk), so a single theme by choice. */
  --panel: #1c2721;
  --panel-raised: #27352c;
  --line: #3b4d40;
  --ink: #f2ecd9;
  --muted: #a3b09d;
  --brass: #e2a52e;
  --signal: #c9452c;
  --wood: #b5773c;
  --leaf: #7fa650;
  --ground: #5d7a48;
  --font-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #141c18;
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.game {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--panel);
}

/* Scoreboard */
.hud {
  padding: calc(10px + env(safe-area-inset-top)) 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.hud-main { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.coins {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.coin {
  width: 0.55em; height: 0.55em; border-radius: 50%;
  background: var(--brass);
  box-shadow: inset 0 0 0 0.07em #f6cf78, inset 0 0 0 0.14em #b47d17;
  flex: none;
}
.coins.bump #coins { animation: bump 240ms ease-out; }
@keyframes bump { 0% { transform: translateY(0); } 40% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
.rate {
  font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--muted);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.rate b { color: var(--ink); font-weight: 600; }
.cargo-label {
  display: flex; justify-content: space-between;
  font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
  margin-bottom: 4px;
}
.bar { height: 8px; border-radius: 4px; background: #131a16; overflow: hidden; display: flex; }
.bar > div { height: 100%; width: 0; flex: none; }
.tip { margin: 0; font-size: 13px; line-height: 1.3; color: var(--muted); min-height: 1.3em; }

/* Map */
.map {
  position: relative; flex: 1; min-height: 0;
  background: var(--ground);
  border-top: 1px solid #0f1512; border-bottom: 1px solid #0f1512;
  cursor: pointer;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chip {
  position: absolute; left: 12px; top: 10px;
  font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.02em;
  background: rgba(20, 28, 24, 0.82); color: var(--ink);
  padding: 4px 9px; border-radius: 6px; pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.hint { left: 50%; top: 66%; transform: translate(-50%, -50%); max-width: 46%; text-align: center; line-height: 1.2; }
.toast {
  position: absolute; left: 16px; right: 16px; top: 44px;
  background: rgba(20, 28, 24, 0.94); border: 1px solid var(--brass); border-radius: 10px;
  padding: 10px 12px; font-size: 15px; line-height: 1.35; text-align: center; pointer-events: none;
}
.toast b { color: var(--brass); font-weight: 600; }
[hidden] { display: none !important; }

/* Workshop */
.shop { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 16px 6px; }
.land, .up {
  position: relative; overflow: hidden;
  text-align: left; color: var(--ink); font: inherit;
  border: 1px solid var(--line); border-radius: 10px;
  cursor: pointer;
}
.land {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 56px; padding: 8px 12px 8px 14px;
  /* The darker fill creeps across as coins approach the price. */
  background: linear-gradient(90deg, #3a4f37 0, #3a4f37 var(--p, 0%), var(--panel-raised) var(--p, 0%));
}
.land.ready { border-color: var(--brass); }
.land-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.land-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.05; }
.land-blurb { font-size: 13px; color: var(--muted); line-height: 1.25; }
.up {
  display: flex; flex-direction: column; gap: 3px;
  min-height: 76px; padding: 9px 10px 9px 14px;
  background: var(--panel-raised);
}
.up::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe); }
.up[data-key="speed"] { --stripe: var(--signal); }
.up[data-key="cargo"] { --stripe: var(--brass); }
.up[data-key="power"] { --stripe: var(--wood); }
.up[data-key="regrow"] { --stripe: var(--leaf); }
.land:active, .up:active { transform: scale(0.98); }
.land:focus-visible, .up:focus-visible, .reset:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.up-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.up-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.up-lvl { font-family: var(--font-display); font-weight: 500; font-size: 14px; color: var(--muted); white-space: nowrap; }
.up-stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.25; }
.up-stat b { color: var(--ink); font-weight: 500; }
.up-cost {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1;
  font-variant-numeric: tabular-nums; color: var(--brass); white-space: nowrap;
}
.up .up-cost { margin-top: auto; }
[aria-disabled="true"] { cursor: default; }
[aria-disabled="true"] .up-cost { color: var(--muted); }
[aria-disabled="true"] .coin { filter: grayscale(1) brightness(0.8); }
.up.limit { border-color: var(--brass); }
.up .flag {
  display: none;
  font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  color: #1c2721; background: var(--brass); border-radius: 4px; padding: 1px 5px; margin-left: auto;
}
.up.limit .flag { display: inline-block; }

.foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 16px calc(8px + env(safe-area-inset-bottom));
  font-size: 12px; color: var(--muted);
}
.reset { font: inherit; color: var(--muted); background: none; border: 0; padding: 8px 0 8px 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.reset.armed { color: var(--signal); font-weight: 600; }

@media (max-height: 700px) {
  .coins { font-size: 32px; }
  .tip { display: none; }
  .up { min-height: 66px; }
  .land { min-height: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .coins.bump #coins { animation: none; }
  .land:active, .up:active { transform: none; }
}
</style>
</head>
<body>
<main class="game">
  <header class="hud">
    <div class="hud-main">
      <div class="coins" id="coinsWrap" aria-label="Coins"><span class="coin"></span><span id="coins">0</span></div>
      <div class="rate"><b id="rate">0</b> coins / min</div>
    </div>
    <div>
      <div class="cargo-label"><span>Wagon load</span><span id="cargoText">0 / 10</span></div>
      <div class="bar" id="cargoBar"></div>
    </div>
    <p class="tip" id="tip"></p>
  </header>

  <div class="map" id="map">
    <canvas id="c" aria-label="Map of the loop. The train gathers wood, stone and ore as it passes and sells them at the depot."></canvas>
    <div class="chip" id="steam" hidden></div>
    <div class="chip hint" id="hint" hidden>Tap the map to stoke the engine</div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <section class="shop" aria-label="Upgrades">
    <button class="land" type="button" id="land">
      <span class="land-text"><span class="land-name" id="landName"></span><span class="land-blurb" id="landBlurb"></span></span>
      <span class="up-cost" id="landCostWrap"><span class="coin"></span><span id="landCost"></span></span>
    </button>
    <button class="up" type="button" data-key="speed" id="up-speed">
      <span class="up-head"><span class="up-name">Engine</span><span class="up-lvl"></span></span>
      <span class="up-stat"></span><span class="up-cost"><span class="coin"></span><span class="cost-n"></span><span class="flag">Bottleneck</span></span>
    </button>
    <button class="up" type="button" data-key="cargo" id="up-cargo">
      <span class="up-head"><span class="up-name">Wagon</span><span class="up-lvl"></span></span>
      <span class="up-stat"></span><span class="up-cost"><span class="coin"></span><span class="cost-n"></span><span class="flag">Bottleneck</span></span>
    </button>
    <button class="up" type="button" data-key="power" id="up-power">
      <span class="up-head"><span class="up-name">Tools</span><span class="up-lvl"></span></span>
      <span class="up-stat"></span><span class="up-cost"><span class="coin"></span><span class="cost-n"></span><span class="flag">Bottleneck</span></span>
    </button>
    <button class="up" type="button" data-key="regrow" id="up-regrow">
      <span class="up-head"><span class="up-name">Growth</span><span class="up-lvl"></span></span>
      <span class="up-stat"></span><span class="up-cost"><span class="coin"></span><span class="cost-n"></span><span class="flag">Bottleneck</span></span>
    </button>
  </section>

  <footer class="foot">
    <span>Loop Line · v0.2.1</span>
    <button class="reset" type="button" id="reset">Reset game</button>
  </footer>
</main>

<script>
(() => {
'use strict';

// <logic>
// Everything between the logic markers is plain game rules with no page or
// drawing code, so it can be run and tested on its own (see test/logic.test.js).

const CFG = {
  baseSpeed: 50,         // track units per second (a 20 second lap on the first loop)
  baseCargo: 10,         // units the wagon holds
  basePower: 1,          // units from one fully grown tree or rock
  baseRegrow: 10,        // seconds for a tree or rock to come back
  minRegrow: 1.5,
  minCut: 0.05,          // anything smaller than this is left alone
  steamPerTap: 0.25,     // each tap adds this much boost
  steamMax: 1,           // boost tops out at double speed
  steamDecay: 0.5,       // boost lost per second
  offlineCapSec: 3600,   // time away that still earns
  rings: [310, 420, 530, 640, 750],   // distance from the depot where each richer ground begins
  upgrades: {
    speed:  { baseCost: 15, growth: 1.30 },
    cargo:  { baseCost: 10, growth: 1.25 },
    power:  { baseCost: 20, growth: 1.27 },
    regrow: { baseCost: 30, growth: 1.32 },
  },
};
const KEYS = ['speed', 'cargo', 'power', 'regrow'];

// What the train can gather, and what each unit sells for.
// The ground gets richer in rings around the depot, in this order.
const RES = {
  wood:     { price: 2,  name: 'Wood' },
  hardwood: { price: 4,  name: 'Hardwood' },
  stone:    { price: 8,  name: 'Stone' },
  iron:     { price: 16, name: 'Iron' },
  gold:     { price: 32, name: 'Gold' },
  crystal:  { price: 64, name: 'Crystal' },
};
const RES_KEYS = ['wood', 'hardwood', 'stone', 'iron', 'gold', 'crystal'];

// Each land is a bigger loop. "size" multiplies the first loop, "nodes" is how
// many trees and rocks stand along it, "cost" is the price to extend there.
const LANDS = [
  { name: 'Home Woods',   size: 1.0, nodes: 12, cost: 0 },
  { name: 'Deep Woods',   size: 1.4, nodes: 18, cost: 150 },
  { name: 'The Quarry',   size: 1.8, nodes: 24, cost: 1500 },
  { name: 'Iron Ridge',   size: 2.2, nodes: 30, cost: 12000 },
  { name: 'Gold Hills',   size: 2.6, nodes: 36, cost: 100000 },
  { name: 'Crystal Peak', size: 3.0, nodes: 44, cost: 800000 },
];
const BASE_LAP = 1000;                                        // length of the first loop
const BASE_R = 140;                                           // radius of its curved ends
const BASE_HALF = (BASE_LAP - 2 * Math.PI * BASE_R) / 4;      // half of one straight side

const mod = (a, n) => ((a % n) + n) % n;

// The loop is a stadium shape: two straights joined by two half circles.
// The depot sits at (0, 0) in the middle of the west straight, and the loop
// grows east, north and south from there. at(f) gives the point a fraction f
// of the way round, the direction of travel and the direction facing outward.
function loopAt(size) {
  const r = BASE_R * size, half = BASE_HALF * size, straight = 2 * half;
  const perim = BASE_LAP * size;
  function at(f) {
    let d = mod(f, 1) * perim;
    let x, y, dx, dy;
    if (d < half) { x = 0; y = -d; dx = 0; dy = -1; }
    else if ((d -= half) < Math.PI * r) {
      const a = Math.PI + d / r;
      x = r + r * Math.cos(a); y = -half + r * Math.sin(a); dx = -Math.sin(a); dy = Math.cos(a);
    }
    else if ((d -= Math.PI * r) < straight) { x = 2 * r; y = -half + d; dx = 0; dy = 1; }
    else if ((d -= straight) < Math.PI * r) {
      const a = d / r;
      x = r + r * Math.cos(a); y = half + r * Math.sin(a); dx = -Math.sin(a); dy = Math.cos(a);
    }
    else { d -= Math.PI * r; x = 0; y = half - d; dx = 0; dy = -1; }
    return { x, y, dx, dy, nx: dy, ny: -dx };
  }
  return { size, r, half, perim, at };
}

// The kind of ground at a spot decides what grows there. The farther from
// the depot, the richer it is.
function biomeAt(x, y) {
  const d = Math.hypot(x, y);
  let ring = 0;
  while (ring < CFG.rings.length && d > CFG.rings[ring]) ring++;
  return RES_KEYS[ring];
}
const emptyCargo = () => { const c = {}; for (const k of RES_KEYS) c[k] = 0; return c; };

const nodeCache = [];
function nodesFor(land) {
  if (!nodeCache[land]) {
    const lp = loopAt(LANDS[land].size), n = LANDS[land].nodes, list = [];
    for (let i = 0; i < n; i++) {
      const pos = (i + 0.5) / n * lp.perim;
      const p = lp.at(pos / lp.perim);
      list.push({ pos, type: biomeAt(p.x, p.y) });
    }
    nodeCache[land] = list;
  }
  return nodeCache[land];
}
function countsFor(land) {
  const c = emptyCargo();
  for (const n of nodesFor(land)) c[n.type] += 1;
  return c;
}

function freshState() {
  return {
    coins: 0, totalEarned: 0, laps: 0,
    pos: 0, steam: 0, taps: 0, land: 0,
    cargo: emptyCargo(),
    levels: { speed: 0, cargo: 0, power: 0, regrow: 0 },
    nodes: Array.from({ length: LANDS[0].nodes }, () => 1),   // growth of each tree or rock, 0 to 1
    lastSeen: 0,
  };
}

// What each upgrade level is worth.
const speedAt  = lvl => CFG.baseSpeed * (1 + 0.1 * lvl);
const cargoAt  = lvl => CFG.baseCargo + 5 * lvl;
const powerAt  = lvl => CFG.basePower + 0.5 * lvl;
const regrowAt = lvl => Math.max(CFG.minRegrow, CFG.baseRegrow * Math.pow(0.93, lvl));

const speedOf    = st => speedAt(st.levels.speed);
const cargoOf    = st => cargoAt(st.levels.cargo);
const powerOf    = st => powerAt(st.levels.power);
const regrowOf   = st => regrowAt(st.levels.regrow);
const trackLenOf = st => BASE_LAP * LANDS[st.land].size;
const lapTimeOf  = st => trackLenOf(st) / speedOf(st);
const cargoTotal = st => { let t = 0; for (const k of RES_KEYS) t += st.cargo[k]; return t; };

function costOf(st, key) {
  const u = CFG.upgrades[key];
  return Math.ceil(u.baseCost * Math.pow(u.growth, st.levels[key]));
}
function isMaxed(st, key) {
  return key === 'regrow' && regrowOf(st) <= CFG.minRegrow;
}
function canBuy(st, key) {
  return !isMaxed(st, key) && st.coins >= costOf(st, key);
}
function buy(st, key) {
  if (!canBuy(st, key)) return false;
  st.coins -= costOf(st, key);
  st.levels[key] += 1;
  return true;
}

// Extending the line into the next land.
const nextLand = st => LANDS[st.land + 1] || null;
function canExpand(st) {
  const next = nextLand(st);
  return !!next && st.coins >= next.cost;
}
function expand(st) {
  if (!canExpand(st)) return false;
  const lapShare = st.pos / trackLenOf(st);       // keep the train the same share of the way round
  st.coins -= nextLand(st).cost;
  st.land += 1;
  st.pos = lapShare * trackLenOf(st);
  st.nodes = Array.from({ length: LANDS[st.land].nodes }, () => 1);   // new land arrives fully grown
  return true;
}

function harvest(st, i, events) {
  const space = cargoOf(st) - cargoTotal(st);
  const grown = st.nodes[i];
  if (space <= 1e-9 || grown < CFG.minCut) return;
  const power = powerOf(st);
  const take = Math.min(power * grown, space);
  const type = nodesFor(st.land)[i].type;
  st.nodes[i] = grown - take / power;   // a full wagon leaves part of it standing
  st.cargo[type] += take;
  if (events) events.push({ type: 'cut', node: i, res: type, amount: take });
}
function sellCargo(st, events) {
  st.laps += 1;
  let gain = 0;
  for (const k of RES_KEYS) { gain += st.cargo[k] * RES[k].price; st.cargo[k] = 0; }
  if (gain <= 0) return;
  st.coins += gain;
  st.totalEarned += gain;
  if (events) events.push({ type: 'sell', amount: gain });
}

// Move the game forward by a small slice of time (well under one lap).
function step(st, dt, events) {
  const L = trackLenOf(st);
  const nodes = nodesFor(st.land);
  const grow = dt / regrowOf(st);
  for (let i = 0; i < st.nodes.length; i++) {
    if (st.nodes[i] < 1) st.nodes[i] = Math.min(1, st.nodes[i] + grow);
  }
  const dist = speedOf(st) * (1 + st.steam) * dt;
  st.steam = Math.max(0, st.steam - CFG.steamDecay * dt);

  // Everything the engine passes in this slice, in the order it passes it.
  const from = st.pos;
  const hits = [];
  for (let i = 0; i < nodes.length; i++) {
    const off = mod(nodes[i].pos - from, L);
    if (off > 0 && off <= dist) hits.push([off, i]);
  }
  const depotOff = mod(-from, L);       // the depot is at position 0
  if (depotOff > 0 && depotOff <= dist) hits.push([depotOff, -1]);
  hits.sort((a, b) => a[0] - b[0]);
  for (const [, i] of hits) {
    if (i >= 0) harvest(st, i, events); else sellCargo(st, events);
  }
  st.pos = mod(from + dist, L);
}

// Move forward by any amount of time, in safe slices. Returns coins earned.
function advance(st, seconds, events) {
  const before = st.totalEarned;
  const slice = Math.min(0.1, 0.2 * BASE_LAP / (speedOf(st) * (1 + CFG.steamMax)));
  let left = seconds;
  while (left > 1e-9) {
    const dt = Math.min(slice, left);
    step(st, dt, events);
    left -= dt;
  }
  return st.totalEarned - before;
}

function addSteam(st) {
  st.steam = Math.min(CFG.steamMax, st.steam + CFG.steamPerTap);
  st.taps += 1;
}

// What one lap offers and what the wagon carries home, filling it in the
// order the train meets things.
function lapHaul(st) {
  const regrownShare = Math.min(1, lapTimeOf(st) / regrowOf(st));
  const each = powerOf(st) * regrownShare;
  let space = cargoOf(st), offered = 0, value = 0;
  for (const n of nodesFor(st.land)) {
    offered += each;
    const take = Math.min(each, space);
    space -= take;
    value += take * RES[n.type].price;
  }
  return { offered, value };
}
function incomePerMin(st) {
  return lapHaul(st).value * 60 / lapTimeOf(st);
}
// Which part is holding income back right now.
function bottleneck(st) {
  if (lapHaul(st).offered > cargoOf(st) + 1e-9) return 'cargo';
  if (lapTimeOf(st) < regrowOf(st) - 1e-9 && !isMaxed(st, 'regrow')) return 'regrow';
  return 'none';
}

function serialize(st, now) {
  return JSON.stringify({
    v: 2, coins: st.coins, totalEarned: st.totalEarned, laps: st.laps,
    pos: st.pos, cargo: st.cargo, taps: st.taps, land: st.land,
    levels: st.levels, nodes: st.nodes, lastSeen: now,
  });
}
// Reads a save, including saves from version 0.1 (wood only, one land).
function deserialize(text) {
  const st = freshState();
  let raw;
  try { raw = JSON.parse(text); } catch (e) { return st; }
  if (!raw || typeof raw !== 'object' || (raw.v !== 1 && raw.v !== 2)) return st;
  const num = (x, lo, hi, dflt) => (typeof x === 'number' && isFinite(x)) ? Math.min(hi, Math.max(lo, x)) : dflt;
  st.coins = num(raw.coins, 0, 1e300, 0);

  ctx.fillStyle = COL.shadow; lump(t.x + 1.5 * E, t.y + 2.5 * E, R, t.seed); ctx.fill();
  ctx.fillStyle = look.base; lump(t.x, t.y, R, t.seed); ctx.fill();
  ctx.fillStyle = look.light; lump(t.x - R * 0.18, t.y - R * 0.2, R * 0.58, t.seed + 0.3); ctx.fill();
  if (look.fleck) {
    ctx.fillStyle = look.fleck;
    for (let i = 0; i < 3; i++) {
      const a = i * 2.2 + t.seed * 6.28, fx = t.x + Math.cos(a) * R * 0.42, fy = t.y + Math.sin(a) * R * 0.36;
      ctx.beginPath();
      if (t.type === 'crystal') {           // crystals are sharp shards, ore is round nuggets
        ctx.moveTo(fx, fy - R * 0.42); ctx.lineTo(fx + R * 0.2, fy + R * 0.16); ctx.lineTo(fx - R * 0.2, fy + R * 0.16); ctx.closePath();
      } else ctx.arc(fx, fy, R * 0.2, 0, 7);
      ctx.fill();
    }
  }
}

// Where a train car sits, given how far behind the engine's nose its middle is (in screen px).
function carSpot(behindPx) {
  return trackPt(st.pos / trackLenOf(st) - behindPx / (cam.lp.perim * cam.S));
}
function withCar(p, draw) {
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.dy, p.dx)); draw(); ctx.restore();
}

function drawTrain() {
  const E = cam.E;
  const engLen = 32 * E, wagLen = 28 * E, wide = 15 * E, gap = 4 * E;
  const eng = carSpot(engLen / 2), wag = carSpot(engLen + gap + wagLen / 2);
  const link = carSpot(engLen + gap / 2);

  ctx.fillStyle = COL.iron;
  ctx.beginPath(); ctx.arc(link.x, link.y, 2.2 * E, 0, 7); ctx.fill();

  withCar(wag, () => {
    ctx.fillStyle = COL.shadow; roundRect(ctx, -wagLen / 2 + 1.5 * E, -wide / 2 + 2.5 * E, wagLen, wide, 3 * E); ctx.fill();
    ctx.fillStyle = COL.wagonDark; roundRect(ctx, -wagLen / 2, -wide / 2, wagLen, wide, 3 * E); ctx.fill();
    ctx.fillStyle = COL.wagon; roundRect(ctx, -wagLen / 2, -wide / 2, wagLen, wide - 1.5 * E, 3 * E); ctx.fill();
    const bedL = wagLen - 6 * E, bedW = wide - 6.5 * E, bedY = -wide / 2 + 2.5 * E;
    ctx.fillStyle = COL.wagonBed; roundRect(ctx, -bedL / 2, bedY, bedL, bedW, 1.5 * E); ctx.fill();
    // The load fills the bed from the back, one band per kind of cargo.
    const cap = cargoOf(st);
    let x = -bedL / 2;
    for (const k of RES_KEYS) {
      const len = bedL * Math.min(1, st.cargo[k] / cap);
      if (len < 0.5) continue;
      ctx.fillStyle = COL.load[k]; roundRect(ctx, x, bedY + 0.5 * E, len, bedW - E, 1.2 * E); ctx.fill();
      x += len;
    }
  });

  withCar(eng, () => {
    ctx.fillStyle = COL.shadow; roundRect(ctx, -engLen / 2 + 1.5 * E, -wide / 2 + 2.5 * E, engLen, wide, 4 * E); ctx.fill();
    ctx.fillStyle = COL.engineDark; roundRect(ctx, -engLen / 2, -wide / 2, engLen, wide, 4 * E); ctx.fill();
    ctx.fillStyle = COL.engine; roundRect(ctx, -engLen / 2, -wide / 2, engLen, wide - 1.5 * E, 4 * E); ctx.fill();
    // Cab at the back, boiler band, stack and a cutter bar out front.
    ctx.fillStyle = COL.iron; roundRect(ctx, -engLen / 2 + 2 * E, -wide / 2 + 2 * E, 9 * E, wide - 5.5 * E, 2 * E); ctx.fill();
    ctx.fillStyle = COL.ironLight; roundRect(ctx, -engLen / 2 + 3.5 * E, -wide / 2 + 3.5 * E, 6 * E, wide - 8.5 * E, 1 * E); ctx.fill();
    ctx.fillStyle = COL.depotTrim; ctx.fillRect(-1 * E, -wide / 2 + 0.5 * E, 2 * E, wide - 2.5 * E);
    ctx.fillStyle = COL.iron; ctx.beginPath(); ctx.arc(7.5 * E, -0.7 * E, 4 * E, 0, 7); ctx.fill();
    ctx.fillStyle = '#12100e'; ctx.beginPath(); ctx.arc(7.5 * E, -0.7 * E, 2.3 * E, 0, 7); ctx.fill();
    ctx.fillStyle = COL.iron; ctx.fillRect(engLen / 2 - 1.5 * E, -wide / 2 - 2.5 * E, 2.5 * E, wide + 3.5 * E);
  });
  return eng;
}

function drawFrame(dt, time) {
  const E = cam.E;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (view.t < 1 || !groundCache) paintGround(ctx); else ctx.drawImage(groundCache, 0, 0, W, H);
  const count = Math.min(nodePts.length, st.nodes.length);
  for (let i = 0; i < count; i++) {
    if (LEAVES[nodePts[i].type]) drawTree(nodePts[i], st.nodes[i], time); else drawRock(nodePts[i], st.nodes[i]);
  }
  const eng = drawTrain();

  if (!reduceMotion) {
    puffClock -= dt * (1 + st.steam * 1.5);
    if (puffClock <= 0) {
      puffClock = 0.22;
      puffs.push({ x: eng.x + eng.dx * 7.5 * E, y: eng.y + eng.dy * 7.5 * E, age: 0, life: 1.1, drift: (Math.random() - 0.5) * 8 * E });
    }
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i];
      p.age += dt;
      if (p.age >= p.life) { puffs.splice(i, 1); continue; }
      const k = p.age / p.life;
      ctx.fillStyle = 'rgba(240, 238, 228, ' + (0.5 * (1 - k)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x + p.drift * k, p.y - 14 * E * k, (3 + 6 * k) * E, 0, 7); ctx.fill();
    }
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.age += dt;
    if (f.age >= f.life) { floats.splice(i, 1); continue; }
    const k = f.age / f.life;
    const px = Math.max(11, Math.round((f.big ? 17 : 15) * Math.max(E, 0.8 * U)));
    ctx.font = '700 ' + px + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
    ctx.lineWidth = px / 5;
    ctx.globalAlpha = k < 0.7 ? 1 : (1 - k) / 0.3;
    const y = Math.max(px, f.y - (reduceMotion ? 10 : 10 + 22 * k) * E);   // keep the number on the map
    ctx.strokeStyle = 'rgba(20, 28, 24, 0.85)'; ctx.strokeText(f.text, f.x, y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, y);
  }
  ctx.globalAlpha = 1;
}

function showEvents(events) {
  for (const e of events) {
    if (e.type === 'cut') {
      const t = nodePts[e.node];
      if (!t || e.amount < 0.05) continue;
      floats.push({ x: t.x, y: t.y, text: '+' + fmt1(e.amount), color: COL.float[e.res], age: 0, life: 0.9 });
    } else if (e.type === 'sell') {
      const d = trackPt(0);
      floats.push({ x: d.x - d.nx * 36 * cam.E, y: d.y - d.ny * 36 * cam.E - 12 * cam.E, text: '+' + fmt(e.amount) + ' coins', color: COL.coin, age: 0, life: 1.4, big: true });
      el.coinsWrap.classList.remove('bump');
      void el.coinsWrap.offsetWidth;
      el.coinsWrap.classList.add('bump');
    }
  }
  if (floats.length > 60) floats.splice(0, floats.length - 60);
}

// ---------------------------------------------------------------- time
function awayText(sec) {
  if (sec < 3600) return Math.max(1, Math.round(sec / 60)) + ' min';
  const h = sec / 3600;
  return (h < 10 ? h.toFixed(1) : Math.round(h)) + ' h';
}
// Catch up on time spent with the page closed or in the background.
function catchUp(seconds) {
  if (!(seconds > 0)) return;
  st.steam = 0;
  const counted = Math.min(seconds, CFG.offlineCapSec);
  const earned = advance(st, counted, null);
  if (seconds >= 60 && earned >= 1) {
    const capped = seconds > CFG.offlineCapSec ? ' The train keeps earning for up to ' + awayText(CFG.offlineCapSec) + ' while you are away.' : '';
    showToast('Away for ' + awayText(seconds) + '. The train earned <b>' + fmt(earned) + ' coins</b>.' + capped, 5000);
  }
}

let lastTick = Date.now();
let lastSave = Date.now();
const events = [];
function frame() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  if (dt > 1) {
    catchUp(dt);               // the page was asleep
  } else if (dt > 0) {
    events.length = 0;
    advance(st, dt, events);
    if (cam) showEvents(events);
  }
  if (cam) {
    const shownDt = Math.min(Math.max(dt, 0), 0.1);
    updateView(shownDt);
    drawFrame(shownDt, now / 1000);
  }
  updateHud();
  if (now - lastSave > 5000) { lastSave = now; saveState(); }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- input
el.map.addEventListener('pointerdown', e => {
  e.preventDefault();
  addSteam(st);
  puffClock = 0;
});
for (const key of KEYS) {
  upEls[key].btn.addEventListener('click', () => {
    if (buy(st, key)) { updateHud(); saveState(); }
  });
}
el.land.addEventListener('click', () => {
  const blurb = nextLand(st) ? landBlurb(st.land + 1) : '';
  if (!expand(st)) return;
  floats.length = 0;
  glideTo(LANDS[st.land].size);
  showToast('The line now reaches <b>' + LANDS[st.land].name + '</b>. ' + blurb + '.', 4500);
  updateHud();
  saveState();
});
let resetTimer = 0;
el.reset.addEventListener('click', () => {
  if (!el.reset.classList.contains('armed')) {
    el.reset.classList.add('armed');
    el.reset.textContent = 'Tap again to erase all progress';
    resetTimer = setTimeout(() => { el.reset.classList.remove('armed'); el.reset.textContent = 'Reset game'; }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  el.reset.classList.remove('armed');
  el.reset.textContent = 'Reset game';
  st = freshState();
  floats.length = 0;
  view.size = view.from = view.to = LANDS[0].size; view.t = 1;
  if (W) { refreshView(); cacheGround(); }
  saveState();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
window.addEventListener('pagehide', saveState);

// ---------------------------------------------------------------- start
if (window.ResizeObserver) new ResizeObserver(resize).observe(el.map);
else window.addEventListener('resize', resize);
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (cam) cacheGround(); });
if (st.lastSeen > 0) catchUp((Date.now() - st.lastSeen) / 1000);
updateHud();
requestAnimationFrame(frame);

// Offline support for the installed app (only where the browser allows it).
try {
  const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || local)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) { /* not available here */ }
})();
</script>
</body>
